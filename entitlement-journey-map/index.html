<script>
const TREE = {"text": "Why welfare entitlements do not reach people", "meta": "19 failure points along the delivery journey, ranked", "kids": [{"text": "Eligibility", "label": "Stage 1", "meta": "Do the rules let the person in?", "kids": [{"text": "Eligible people sit above the food-list ceiling", "kids": [{"text": "14.2% of the people a calibrated survey count treats as eligible for free grain sit above the legal ceiling: 12.7 to 14.1 crore people.", "label": "What we see", "meta": "Status: Established", "kind": "see", "basis": {"k": "calc", "t": "Our calculation", "x": "94.76 crore eligible (HCES 2023-24, scaled to the 2024 population) minus the 81.35 crore NFSA ceiling = 13.41 crore, or 14.2% of the eligible; 12.7 to 14.1 crore across calibration choices", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}, {"title": "National Food Security Act 2013 (Gazette text, PRS copy)", "url": "https://prsindia.org/files/bills_acts/acts_parliament/2013/national-food-security-act-2013.pdf"}]}}, {"text": "1 further data point", "label": "More evidence", "kids": [{"text": "Raising the ceiling to cover them would cost Rs 33,355 to 40,756 crore a year.", "kind": "ev", "basis": {"k": "calc", "t": "Our calculation", "x": "people above the ceiling × food subsidy cost per person-year at the 2025-26 revised estimate", "s": [{"title": "Union Budget: Expenditure Profile 2026-27, Statement 7 (subsidies)", "url": "https://www.indiabudget.gov.in/doc/eb/stat7.xlsx"}]}}], "kind": "hub"}, {"text": "Each state's total is fixed by law, so people beyond it cannot be added, however poor they are.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the National Food Security Act, Sections 3 and 9", "s": [{"title": "National Food Security Act 2013 (Gazette text, PRS copy)", "url": "https://prsindia.org/files/bills_acts/acts_parliament/2013/national-food-security-act-2013.pdf"}]}}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Coverage ceiling: 75% of the rural and 50% of the urban population", "label": "Cause", "meta": "11.5 to 26.3 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "The law fixes the share of people a state can cover. Controls it: Parliament.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the Act's coverage rule", "s": [{"title": "National Food Security Act 2013 (Gazette text, PRS copy)", "url": "https://prsindia.org/files/bills_acts/acts_parliament/2013/national-food-security-act-2013.pdf"}]}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}, {"text": "Old population base: state totals still use Census 2011", "label": "Cause", "meta": "8.9 to 19 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "People who are eligible today have no slot because the totals were set on the 2011 population. Controls it: Registrar General; the food ministry then resets state totals.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the Act, which fixes state totals on the latest published Census", "s": [{"title": "National Food Security Act 2013 (Gazette text, PRS copy)", "url": "https://prsindia.org/files/bills_acts/acts_parliament/2013/national-food-security-act-2013.pdf"}]}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}], "kind": "hub"}, {"text": "Publish the gap between the eligible count and the ceiling, state by state", "label": "Possible intervention", "meta": "Proof so far: No trial; this is an evidence role  ·  By: Research and civil society", "kind": "fix"}, {"text": "Parliament for the 75/50 ceiling; Registrar General and food ministry for the 2011 base, due for refresh after the Census count of 1 Mar 2027", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "the Act", "s": [{"title": "National Food Security Act 2013 (Gazette text, PRS copy)", "url": "https://prsindia.org/files/bills_acts/acts_parliament/2013/national-food-security-act-2013.pdf"}]}}, {"text": "Size 5 × evidence 2 × movable 1 = 10 of 45", "label": "Why it ranks here", "kids": [{"text": "12.7 to 14.1 crore people", "label": "Size", "kind": "leaf"}, {"text": "A legal rule plus a calibrated survey count; which of the two causes is larger depends on the calibration", "label": "Evidence strength", "kind": "leaf"}, {"text": "Law and the Census decide it", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}, {"text": "1 finding from our analysis", "label": "Research behind it", "kids": [{"text": "Near-universal ration cards halve poor exclusion nationally, but also pull in the rich", "kids": [{"text": "Universality is a trade: nationally it halves poor exclusion, at the price of about 19 more points of rich households using the shop. In India-1 the gain is smaller (23% vs 32% of the poor left out). States with different rules are compared, so this is an association. It is the design choice behind the 75/50 ceiling and the 2027 Census debate.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "HCES 2023-24 unit data, states grouped by card coverage", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}]}}], "kind": "hub"}], "kind": "prob", "id": "E1", "rank": 9, "score": 10, "fam": "design"}, {"text": "The state is not running the scheme, or funds are withheld", "kids": [{"text": "22 cases from 2022 to 2026 where a state stayed out of a central scheme or the Centre withheld its share.", "label": "What we see", "meta": "Status: Established", "kind": "see", "basis": {"k": "review", "t": "Our review of public records", "x": "22 state-scheme cases coded from news, MoUs and court records, 2022 to 2026", "s": [{"title": "The Tribune 8 Jun 2026: West Bengal joins Ayushman Bharat PM-JAY", "url": "https://www.tribuneindia.com/news/india/west-bengal-joins-ayushman-bharat-pm-jay/"}, {"title": "The Wire 20 May 2026: Union stalls Rs 3,500 crore, Tamil Nadu holds firm", "url": "https://thewire.in/education/union-govt-stalls-rs-3500-crore-for-two-years-but-tamil-nadu-holds-firm-on-two-language-policy"}]}}, {"text": "3 further data points", "label": "More evidence", "kids": [{"text": "Main reason: cost share 7 (6 of them crop insurance), the state's own scheme already better 3, the Centre withholding over compliance 3, technical capacity 3, policy conditions 2, branding 1, not confirmed 3.", "kind": "ev", "basis": {"k": "review", "t": "Our review of public records", "x": "the same 22 cases, each coded by its main stated reason", "s": []}}, {"text": "PM-JAY opt-outs ended after a change of state government: Odisha (Jan 2025), Delhi (Apr 2025) and West Bengal (Jun 2026, about 1.24 crore families).", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "state MoUs and reports", "s": [{"title": "Akashvani News 13 Jan 2025: Odisha becomes 34th state to implement PM-JAY", "url": "https://www.newsonair.gov.in/odisha-becomes-34th-state-ut-to-implement-ayushman-bharat-pm-jay"}, {"title": "Akashvani News 5 Apr 2025: Delhi joins Ayushman Bharat, cover doubled to Rs 10 lakh", "url": "https://www.newsonair.gov.in/delhi-joins-ayushman-bharat-doubles-health-cover-to-%E2%82%B910-lakh-per-family"}, {"title": "The Tribune 8 Jun 2026: West Bengal joins Ayushman Bharat PM-JAY", "url": "https://www.tribuneindia.com/news/india/west-bengal-joins-ayushman-bharat-pm-jay/"}]}}, {"text": "Tamil Nadu: Rs 2,151.59 crore of the central school-education share was withheld in 2024-25, over Rs 3,500 crore across two years; the case is pending.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "court filing and press report", "s": [{"title": "The Wire 20 May 2026: Union stalls Rs 3,500 crore, Tamil Nadu holds firm", "url": "https://thewire.in/education/union-govt-stalls-rs-3500-crore-for-two-years-but-tamil-nadu-holds-firm-on-two-language-policy"}]}}], "kind": "hub"}, {"text": "Where a state stays out, or the Centre withholds its share, households there are not covered at all.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the 22 cases", "s": []}}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "State opt-outs and withheld funds", "label": "Cause", "meta": "7.5 to 20.2 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "This follows politics and cost-sharing more than scheme design.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the 22 cases; most ended after a change of state government", "s": []}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}], "kind": "hub"}, {"text": "No household-level fix; publish who is left out, by place", "label": "Possible intervention", "meta": "Proof so far: Most recent opt-outs ended after a change of state government", "kind": "fix"}, {"text": "Union and state governments; courts", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "the 22 cases", "s": []}}, {"text": "Size 4 × evidence 2 × movable 1 = 8 of 45", "label": "Why it ranks here", "kids": [{"text": "Whole states at a time, for example 1.24 crore families in West Bengal outside PM-JAY until Jun 2026", "label": "Size", "kind": "leaf"}, {"text": "Case coding from public reporting, 2022 to 2026", "label": "Evidence strength", "kind": "leaf"}, {"text": "A political decision", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}], "kind": "prob", "id": "E2", "rank": 11, "score": 8, "fam": "design"}, {"text": "State pensions shut out the poor who lack a BPL or AAY card", "kids": [{"text": "Most people left out of two Maharashtra pensions hold no AAY or BPL card, which the rule asks for unless family income is under Rs 21,000 a year: 41.8 to 78.5% for Shravan Bal and 40.7 to 63.7% for Sanjay Gandhi Niradhar.", "label": "What we see", "meta": "Status: Likely", "kind": "see", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "HCES 2023-24 and PLFS 2025 unit data: people who meet each pension's test but get nothing, by card held", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}, {"title": "MoSPI microdata: PLFS Calendar Year 2025 (Jan-Dec 2025)", "url": "https://microdata.gov.in/nada/index.php/catalog/284"}, {"title": "SJSA Maharashtra: Shravan Bal Rajya Nivruttivetan Yojana", "url": "https://sjsa.maharashtra.gov.in/en/scheme/shravan-bal-rajya-nivruttivetan-yojana/"}]}}, {"text": "The card is the entry test, so a poor person without one is ineligible on paper.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the scheme rules", "s": [{"title": "SJSA Maharashtra: Shravan Bal Rajya Nivruttivetan Yojana", "url": "https://sjsa.maharashtra.gov.in/en/scheme/shravan-bal-rajya-nivruttivetan-yojana/"}]}}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "Rules too narrow or unclear", "label": "Cause", "meta": "0.3 to 4.9 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "Income tests, age limits or card routes leave out poor people who are not on an old list. Controls it: Cabinet and state governments.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the scheme rules", "s": [{"title": "SJSA Maharashtra: Shravan Bal Rajya Nivruttivetan Yojana", "url": "https://sjsa.maharashtra.gov.in/en/scheme/shravan-bal-rajya-nivruttivetan-yojana/"}]}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}], "kind": "hub"}, {"text": "Help people get the qualifying card, then apply", "label": "Possible intervention", "meta": "Proof so far: The Delhi trial under rank 1 found documents were the binding step  ·  By: Frontline staff; assisted channels", "kind": "fix", "basis": {"k": "src", "t": "Source", "x": "", "s": [{"title": "J-PAL: Delhi widow pension application assistance trial (Gupta)", "url": "https://www.povertyactionlab.org/evaluation/providing-information-and-application-assistance-improve-social-pension-enrollment-india"}]}}, {"text": "State governments for the rule; revenue offices for the cards", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "the scheme rules", "s": [{"title": "SJSA Maharashtra: Shravan Bal Rajya Nivruttivetan Yojana", "url": "https://sjsa.maharashtra.gov.in/en/scheme/shravan-bal-rajya-nivruttivetan-yojana/"}]}}, {"text": "Size 2 × evidence 2 × movable 2 = 8 of 45", "label": "Why it ranks here", "kids": [{"text": "Lakhs of people per state scheme", "label": "Size", "kind": "leaf"}, {"text": "A survey cut of excluded people; card labels differ by state", "label": "Evidence strength", "kind": "leaf"}, {"text": "Partly: card access can be supported", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}], "kind": "prob", "id": "E4", "rank": 11, "score": 8, "fam": "design"}, {"text": "Seats and funded slots are far below the eligible pool", "kids": [{"text": "Seats cover only 2.6 to 2.8% of the eligible tribal student pool in Eklavya schools at full build, and 4.6 to 7.0% of the pool for Andhra Pradesh SC and BC hostels.", "label": "What we see", "meta": "Status: Established", "kind": "see", "basis": {"k": "calc", "t": "Our calculation", "x": "seats at full build (scheme documents) ÷ eligible student pool (our estimate from CAMS 2022-23 and PLFS 2025)", "s": [{"title": "PIB (Tribal Affairs): Eklavya Model Residential Schools, Jul 2024", "url": "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2036834&reg=3&lang=2"}, {"title": "AP Finance Dept: Budget 2026-27 documents (Outcome Budget Vol VII-1)", "url": "https://apfinance.gov.in/budget.html"}, {"title": "MoSPI: Comprehensive Annual Modular Survey 2022-23 (NSS 79th round)", "url": "https://www.mospi.gov.in/sites/default/files/publication_reports/CAMS%20Report_October_N.pdf"}, {"title": "MoSPI microdata: PLFS Calendar Year 2025 (Jan-Dec 2025)", "url": "https://microdata.gov.in/nada/index.php/catalog/284"}]}}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "Mid-day meals: the approved 2025-26 plan funds 71.09% of enrolment.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "approved plan", "s": [{"title": "PM POSHAN PAB (Project Approval Board) minutes page", "url": "https://pmposhan.education.gov.in/PAB_PM_POSHAN.html"}]}}, {"text": "Cooking gas: the cap on subsidised refills fell from 12 a year (May 2022) to 9 (2025-26) and 4 (announced Aug 2026). Average use was 4.71 refills a connection in 2025-26, above the new cap.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "refill caps and average use", "s": [{"title": "Lok Sabha USQ 3151 (6 Aug 2026): PMUY refill cap", "url": "https://sansad.in/getFile/lsapps/loksabhaquestions/annex/188/AU3151_0ZImcK.pdf?source=lsapps"}]}}], "kind": "hub"}, {"text": "A scheme with a fixed number of seats, meals or refills cannot reach everyone it is meant for.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the scheme documents above", "s": []}}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "The budget fixes the number of seats, meals or refills", "label": "Cause", "meta": "Not sized in the 20-scheme model", "kids": [{"text": "The cap comes from the budget and the scheme guidelines, not from the size of the eligible pool.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the scheme guidelines and budget documents above", "s": []}}], "kind": "cause"}], "kind": "hub"}, {"text": "Show each cap against the eligible pool in budget discussions", "label": "Possible intervention", "meta": "Proof so far: No trial  ·  By: Research", "kind": "fix"}, {"text": "Union ministries and the finance ministry", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "the scheme documents above", "s": []}}, {"text": "Size 3 × evidence 2 × movable 1 = 6 of 45", "label": "Why it ranks here", "kids": [{"text": "Pools of 1 to 13 crore people with caps far below them", "label": "Size", "kind": "leaf"}, {"text": "Scheme documents and survey-based pools", "label": "Evidence strength", "kind": "leaf"}, {"text": "Budget and design", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}], "kind": "prob", "id": "E3", "rank": 15, "score": 6, "fam": "design"}], "kind": "stage", "fam": "design"}, {"text": "Application", "label": "Stage 2", "meta": "Does the person know, have the papers, and manage to apply?", "kids": [{"text": "People cannot complete the application on their own", "kids": [{"text": "46.8% of adults face at least one of three barriers: no account, cannot use the internet, cannot read. 27.0% face one, 18.2% two and 1.6% all three.", "label": "What we see", "meta": "Status: Established", "kind": "see", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "weighted tabulation of CAMS 2022-23 unit data, about 9 lakh adults 18+", "s": [{"title": "MoSPI: Comprehensive Annual Modular Survey 2022-23 (NSS 79th round)", "url": "https://www.mospi.gov.in/sites/default/files/publication_reports/CAMS%20Report_October_N.pdf"}]}}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "Two or more barriers: 8.6% of adults in India-1, 23.6% in India-2 core and 28.5% in Deep India-2.", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "CAMS 2022-23 by place group", "s": [{"title": "MoSPI: Comprehensive Annual Modular Survey 2022-23 (NSS 79th round)", "url": "https://www.mospi.gov.in/sites/default/files/publication_reports/CAMS%20Report_October_N.pdf"}]}}, {"text": "Among people 15+, 40.1% cannot use the internet and 41.2% cannot use a smartphone.", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "CAMS 2022-23, persons 15+", "s": [{"title": "MoSPI: Comprehensive Annual Modular Survey 2022-23 (NSS 79th round)", "url": "https://www.mospi.gov.in/sites/default/files/publication_reports/CAMS%20Report_October_N.pdf"}]}}], "kind": "hub"}, {"text": "Online and paper forms assume reading, a phone, an account and time; many applicants lack one or more.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the barrier data above and the Delhi trial", "s": [{"title": "J-PAL: Delhi widow pension application assistance trial (Gupta)", "url": "https://www.povertyactionlab.org/evaluation/providing-information-and-application-assistance-improve-social-pension-enrollment-india"}]}}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "Low digital or functional literacy; language", "label": "Cause", "meta": "Named in the cause list but not sized in the 20-scheme model", "kids": [{"text": "The barrier sits with the applicant's skills and the form's design. Controls it: Scheme departments.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the barrier data above", "s": [{"title": "MoSPI: Comprehensive Annual Modular Survey 2022-23 (NSS 79th round)", "url": "https://www.mospi.gov.in/sites/default/files/publication_reports/CAMS%20Report_October_N.pdf"}]}}], "kind": "cause"}], "kind": "hub"}, {"text": "Hands-on help with forms and documents, in the person's language, by voice", "label": "Possible intervention", "meta": "Proof so far: J-PAL trial of Delhi widow pensions (2015; 1,257 women in 75 slums): help with the application raised enrolment by 6.2 points (+42%); with accompaniment to the office, completed applications rose 10.6 points (+70%)  ·  By: Frontline staff; assisted channels", "kind": "fix", "basis": {"k": "src", "t": "Source", "x": "", "s": [{"title": "J-PAL: Delhi widow pension application assistance trial (Gupta)", "url": "https://www.povertyactionlab.org/evaluation/providing-information-and-application-assistance-improve-social-pension-enrollment-india"}]}}, {"text": "Scheme departments; frontline staff", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "scheme application rules", "s": []}}, {"text": "Size 5 × evidence 3 × movable 3 = 45 of 45", "label": "Why it ranks here", "kids": [{"text": "Nearly half of adults; 23.6% in India-2 core face two or more barriers", "label": "Size", "kind": "leaf"}, {"text": "CAMS 2022-23 microdata on about 9 lakh adults, plus an Indian trial", "label": "Evidence strength", "kind": "leaf"}, {"text": "An assisted channel acts on it directly", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}, {"text": "2 findings from our analysis", "label": "Research behind it", "kids": [{"text": "Six in ten of the poorest adults face at least one of three access barriers", "kids": [{"text": "An assisted, voice-first channel is not a nicety: most of the poorest cannot self-serve. About a quarter of Deep India-2 adults face two barriers at once (26.0%, against 7.5% in India-1).", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "CAMS 2022-23 unit data", "s": [{"title": "MoSPI: Comprehensive Annual Modular Survey 2022-23 (NSS 79th round)", "url": "https://www.mospi.gov.in/sites/default/files/publication_reports/CAMS%20Report_October_N.pdf"}]}}, {"text": "The poorest adults prefer a voice call to an SMS; the richest the reverse", "kids": [{"text": "A voice-first channel is the right default for the poorest and women; a text-first product would fit only the better off.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "Global Findex 2025 India unit data", "s": [{"title": "World Bank Microdata Library: Global Findex 2025, India", "url": "https://microdata.worldbank.org/catalog/7916"}]}}], "kind": "hub"}], "kind": "prob", "id": "A1", "rank": 1, "score": 45, "fam": "demand"}, {"text": "Missing documents block the claim", "kids": [{"text": "12.1% of children under 5 have no birth certificate, and 5.4% of adults have no bank, financial-institution or mobile-money account.", "label": "What we see", "meta": "Status: Established", "kind": "see", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "weighted tabulation of CAMS 2022-23 unit data; 'not known' counted as no certificate", "s": [{"title": "MoSPI: Comprehensive Annual Modular Survey 2022-23 (NSS 79th round)", "url": "https://www.mospi.gov.in/sites/default/files/publication_reports/CAMS%20Report_October_N.pdf"}]}}, {"text": "1 further data point", "label": "More evidence", "kids": [{"text": "Maharashtra's Lek Ladki scheme for girls asks for 10 items at application, including the girl's birth certificate, a yellow or orange ration card and a family-planning certificate.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "scheme page on Vikaspedia, the government's scheme portal", "s": [{"title": "Vikaspedia: Lek Ladki scheme, Maharashtra", "url": "https://en.vikaspedia.in/viewcontent/schemesall/state-specific-schemes/welfare-schemes-of-maharashtra/lek-ladki-scheme?lgn=en"}]}}], "kind": "hub"}, {"text": "Each scheme asks for its own set of papers; one missing paper stops the application.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the scheme document lists above", "s": [{"title": "Vikaspedia: Lek Ladki scheme, Maharashtra", "url": "https://en.vikaspedia.in/viewcontent/schemesall/state-specific-schemes/welfare-schemes-of-maharashtra/lek-ladki-scheme?lgn=en"}]}}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Missing documents or certificates", "label": "Cause", "meta": "0.1 to 5.6 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "No birth, caste or income paper, or no Aadhaar in the right form. The PM-JAY figure is mostly an upper bound from Aadhaar coverage.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "scheme rules and Aadhaar coverage data", "s": []}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}, {"text": "Identity or data mismatch (Aadhaar, name spelling, bank mapping)", "label": "Cause", "meta": "0.5 to 3 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "A name or account written differently across records blocks authentication or payment. Controls it: UIDAI, NPCI, banks, state agencies.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "payment-failure reports", "s": []}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}], "kind": "hub"}, {"text": "Help people get and digitise documents before they apply", "label": "Possible intervention", "meta": "Proof so far: Delhi trial (rank 1): supporting documents were the main remaining barrier  ·  By: Revenue and registration offices; assisted channels", "kind": "fix", "basis": {"k": "src", "t": "Source", "x": "", "s": [{"title": "J-PAL: Delhi widow pension application assistance trial (Gupta)", "url": "https://www.povertyactionlab.org/evaluation/providing-information-and-application-assistance-improve-social-pension-enrollment-india"}]}}, {"text": "Revenue and civil-registration offices; frontline staff", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "scheme rules", "s": []}}, {"text": "Size 3 × evidence 3 × movable 3 = 27 of 45", "label": "Why it ranks here", "kids": [{"text": "About 1 in 8 young children; a small share of adults", "label": "Size", "kind": "leaf"}, {"text": "CAMS and NSS Multiple Indicator Survey microdata", "label": "Evidence strength", "kind": "leaf"}, {"text": "Document help is direct", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}, {"text": "4 findings from our analysis", "label": "Research behind it", "kids": [{"text": "In our cause model, missing documents explain little; caps, withheld funds and frozen lists are the largest causes", "kids": [{"text": "Identity and paper problems are real for individuals but small as a share of the national gap. A pilot that only fixes documents would address a small slice.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}, {"text": "Missing birth certificates follow poverty: the poorest children are missed at the same rate in developed and lagging places (16.3% vs 16.9%)", "kids": [{"text": "An identity gap starts at birth and is a poverty gap, the same in a developed city as in lagging India. Since the ration gap is not the same in both, identity at this level cannot be what separates the urban poor.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "CAMS 2022-23 unit data", "s": [{"title": "MoSPI: Comprehensive Annual Modular Survey 2022-23 (NSS 79th round)", "url": "https://www.mospi.gov.in/sites/default/files/publication_reports/CAMS%20Report_October_N.pdf"}]}}, {"text": "Four in ten migrants moved no documents, yet almost none report a problem", "kids": [{"text": "Missing local documents are common but rarely felt as a barrier. India-1's poor moved documents slightly less often (54.0% vs 57.6%) but report fewer problems (2.1% vs 3.5%). A ration card left in the home village would show up as 'card but no purchase', not as a reported problem.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NSS Multiple Indicator Survey 2020-21 unit data", "s": [{"title": "MoSPI microdata: Multiple Indicator Survey, NSS 78th round 2020-21", "url": "https://microdata.gov.in/nada/index.php/catalog/218"}]}}, {"text": "Poorest city adults are less often banked than poorest villagers in lagging districts", "kids": [{"text": "This is the one identity signal that points the urban way: the city poor are more often outside the bank (a know-your-customer and address-proof problem for recent arrivals is one reading). It matters for cash schemes, not for grain.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "CAMS 2022-23 unit data", "s": [{"title": "MoSPI: Comprehensive Annual Modular Survey 2022-23 (NSS 79th round)", "url": "https://www.mospi.gov.in/sites/default/files/publication_reports/CAMS%20Report_October_N.pdf"}]}}], "kind": "hub"}], "kind": "prob", "id": "A3", "rank": 4, "score": 27, "fam": "demand"}, {"text": "People do not know the scheme or that they qualify", "kids": [{"text": "38.5% of eligible rural households in a six-state survey had not heard of PM-JAY.", "label": "What we see", "meta": "Status: Likely", "kind": "see", "basis": {"k": "src", "t": "Source", "x": "household survey in six states, Dec 2019 to Feb 2020", "s": [{"title": "Parisi et al. 2023: PM-JAY awareness, six states (Health Policy and Planning)", "url": "https://doi.org/10.1093/heapol/czac106"}]}}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "Crop insurance: 37 to 69% of farmers who did not insure did not know the scheme.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "published analysis of 2018-19 farm-household data", "s": [{"title": "NSS 77th round (2019): Situation Assessment of Agricultural Households, Report 587", "url": "https://mospi.gov.in/sites/default/files/publication_reports/Report_587m_0.pdf"}]}}, {"text": "School-education benefits: 56.8% of households aware when the informant is a graduate, 28.5% when the informant cannot read.", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NSS Multiple Indicator Survey 2020-21 unit data", "s": [{"title": "MoSPI microdata: Multiple Indicator Survey, NSS 78th round 2020-21", "url": "https://microdata.gov.in/nada/index.php/catalog/218"}]}}], "kind": "hub"}, {"text": "Schemes wait for an application, so people who do not know never start.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the awareness data above", "s": []}}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Not aware of the scheme or of their own eligibility", "label": "Cause", "meta": "7.9 to 20.3 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "In the sample this is mostly crop insurance and PM-JAY. Controls it: Scheme departments and frontline staff.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the awareness studies above", "s": [{"title": "Parisi et al. 2023: PM-JAY awareness, six states (Health Policy and Planning)", "url": "https://doi.org/10.1093/heapol/czac106"}]}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}, {"text": "Low trust, fear or stigma", "label": "Cause", "meta": "Named but not sized; no national survey item", "kids": [{"text": "No national survey asks about it. Controls it: Frontline staff; civil society.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the cause list; no national survey measures it", "s": []}}], "kind": "cause"}], "kind": "hub"}, {"text": "Information on its own", "label": "Possible intervention", "meta": "Proof so far: Karnataka trial of facilitation agents (Berg, Rajasekhar and Manjula 2022): awareness rose, applications and receipt did not  ·  By: Departments", "kind": "fix", "basis": {"k": "src", "t": "Source", "x": "", "s": [{"title": "Berg, Rajasekhar and Manjula 2022: Pushing Welfare (Karnataka facilitation agents)", "url": "https://doi.org/10.1086/713880"}]}}, {"text": "Information paired with the hands-on help under rank 1", "label": "Possible intervention", "meta": "Proof so far: See the Delhi trial under rank 1  ·  By: Assisted channels", "kind": "fix", "basis": {"k": "src", "t": "Source", "x": "", "s": [{"title": "J-PAL: Delhi widow pension application assistance trial (Gupta)", "url": "https://www.povertyactionlab.org/evaluation/providing-information-and-application-assistance-improve-social-pension-enrollment-india"}]}}, {"text": "Scheme departments; frontline staff", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "scheme outreach rules", "s": []}}, {"text": "Size 4 × evidence 1 × movable 2 = 8 of 45", "label": "Why it ranks here", "kids": [{"text": "7.9 to 20.3 points of the gap, a range only", "label": "Size", "kind": "leaf"}, {"text": "Published tables from 2017 to 2020 that we could not audit", "label": "Evidence strength", "kind": "leaf"}, {"text": "Information alone did not change receipt in India", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}], "kind": "prob", "id": "A2", "rank": 11, "score": 8, "fam": "demand"}, {"text": "Claiming costs more than the benefit is worth", "kids": [{"text": "64% of households without a ration card did not apply because of the time it takes.", "label": "What we see", "meta": "Status: Likely", "kind": "see", "basis": {"k": "src", "t": "Source", "x": "systematic review of ration-access studies", "s": [{"title": "Javed and Mumtaz 2024: South Asia's unprotected poor, systematic review (PLOS Global Public Health)", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC11175495/"}]}}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "Cooking gas: the buyer pays Rs 942 a cylinder upfront in Delhi, before the Rs 300 subsidy is credited (since Jun 2026).", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "retail price and subsidy rule", "s": [{"title": "Lok Sabha USQ 3110 (6 Aug 2026): LPG price Rs 942", "url": "https://sansad.in/getFile/lsapps/loksabhaquestions/annex/188/AU3110_zZhnQX.pdf?source=lsapps"}]}}, {"text": "Cooking gas: median willingness to pay is Rs 500 against a net price of Rs 642.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "household survey", "s": [{"title": "CEEW 2026: Subsidised, Not Sustained, rural cooking-fuel trends (Das, Sarma, Kar)", "url": "https://www.ceew.in/sites/default/files/ceew-clean-cooking-fuels-rural-lpg-survey.pdf"}]}}], "kind": "hub"}, {"text": "Trips, lost wages, fees and upfront prices make the claim a loss for some households.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the cost studies above", "s": [{"title": "Javed and Mumtaz 2024: South Asia's unprotected poor, systematic review (PLOS Global Public Health)", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC11175495/"}, {"title": "CEEW 2026: Subsidised, Not Sustained, rural cooking-fuel trends (Das, Sarma, Kar)", "url": "https://www.ceew.in/sites/default/files/ceew-clean-cooking-fuels-rural-lpg-survey.pdf"}]}}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Claim cost too high (cash, trips, lost wages)", "label": "Cause", "meta": "5.5 to 10.8 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "The refill price, the premium or the trips needed outweigh the benefit. Controls it: Cabinet and state governments (scheme design).", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the cost studies above", "s": []}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}, {"text": "Choice not to claim (benefit worth less than the effort)", "label": "Cause", "meta": "4.5 to 11.7 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "People judge the benefit too small or uncertain; mostly crop-insurance farmers who say they have no need. Controls it: Scheme design.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the model rows; mostly crop-insurance farmers", "s": []}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}], "kind": "hub"}, {"text": "Lower the cost of each trip: doorstep or assisted filing", "label": "Possible intervention", "meta": "Proof so far: No trial of this fix; the Jharkhand finding below shows how an added step raises trip costs  ·  By: Departments; assisted channels", "kind": "fix", "basis": {"k": "src", "t": "Source", "x": "", "s": [{"title": "Muralidharan, Niehaus, Sukhtankar 2021: Identity Verification Standards in Welfare Programs (NBER w26744)", "url": "https://www.nber.org/papers/w26744"}]}}, {"text": "Cabinet and state governments for prices; departments for the process", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "scheme price and process rules", "s": []}}, {"text": "Size 3 × evidence 1 × movable 2 = 6 of 45", "label": "Why it ranks here", "kids": [{"text": "5.5 to 10.8 and 4.5 to 11.7 points of the gap, ranges only", "label": "Size", "kind": "leaf"}, {"text": "Reviews and older studies", "label": "Evidence strength", "kind": "leaf"}, {"text": "Process cost can be cut; price is policy", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}, {"text": "1 finding from our analysis", "label": "Research behind it", "kids": [{"text": "A biometric fix in Jharkhand raised trip costs 17% and left leakage unchanged", "kids": [{"text": "A digital identity step added to a weak shop-level process shifted cost to the citizen. Mandatory Aadhaar checks need a fallback, and the weak link is the weighing, not the identity.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "src", "t": "Source", "x": "randomised trial", "s": [{"title": "Muralidharan, Niehaus, Sukhtankar 2021: Identity Verification Standards in Welfare Programs (NBER w26744)", "url": "https://www.nber.org/papers/w26744"}]}}], "kind": "hub"}], "kind": "prob", "id": "A4", "rank": 15, "score": 6, "fam": "demand"}], "kind": "stage", "fam": "demand"}, {"text": "Enrolment and approval", "label": "Stage 3", "meta": "Is the person put on the list?", "kids": [{"text": "Eligible people inside the ceiling are not on the list", "kids": [{"text": "2.65 crore people fit inside the free-grain ceiling but are not on a ration-card list: 78.70 crore are listed (Aug 2026) against a ceiling of 81.35 crore. This is a floor, because the lists also hold some ineligible people. It is separate from the people above the ceiling in Stage 1.", "label": "What we see", "meta": "Status: Likely", "kind": "see", "basis": {"k": "calc", "t": "Our calculation", "x": "81.35 crore NFSA ceiling minus 78.70 crore persons on NFSA lists (Aug 2026) = 2.65 crore", "s": [{"title": "National Food Security Act 2013 (Gazette text, PRS copy)", "url": "https://prsindia.org/files/bills_acts/acts_parliament/2013/national-food-security-act-2013.pdf"}, {"title": "Food ministry IMPDS dashboard (live; now shows later months than Aug 2026)", "url": "https://impds.nic.in/sale"}]}}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "PM-JAY for people 70 and over: just over 93 lakh cards created by 5 Dec 2025 for about 6 crore people covered (about 16%), 14 months after launch.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "Lok Sabha answers", "s": [{"title": "Lok Sabha USQ 2188 (Dec 2025): Vay Vandana cards created", "url": "https://eparlib.sansad.in/bitstream/123456789/3017668/1/AU2188_kak82B.pdf"}, {"title": "Lok Sabha USQ 1374 (6 Feb 2026): PM-JAY cover for 6 crore people aged 70+", "url": "https://sansad.in/getFile/lsapps/loksabhaquestions/annex/187/AU1374_8wDvnA.pdf?source=lsapps"}]}}, {"text": "Bihar old-age pension (MVPY): 86.0% of the eligible count is on the list.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "state pension records", "s": [{"title": "Bihar SSPMIS: District-wise MVPY progress report", "url": "https://www.sspmis.bihar.gov.in/getDistrictWiseMVPYPublicReport"}]}}], "kind": "hub"}, {"text": "Lists are built once and refreshed rarely; new households, split families and migrants are not added.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the list counts above and the Act's revision rule", "s": [{"title": "National Food Security Act 2013 (Gazette text, PRS copy)", "url": "https://prsindia.org/files/bills_acts/acts_parliament/2013/national-food-security-act-2013.pdf"}]}}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "Not explained by any evidence", "label": "Cause", "meta": "5.2 to 36.4 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "The part of the gap no evidence explains, kept separate and never spread over named causes. Mostly PM-JAY people not carded (11.5) and farmers not insured (10.8). Controls it: Not assigned.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the model's unexplained remainder", "s": []}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}, {"text": "Old population base: see Stage 1, rank 9", "label": "Shared cause", "kind": "leaf"}, {"text": "Slow verification: see the next problem", "label": "Shared cause", "kind": "leaf"}], "kind": "hub"}, {"text": "Enrol people from existing data, then confirm with the household", "label": "Possible intervention", "meta": "Proof so far: No Indian trial with an enrolment outcome  ·  By: State departments", "kind": "fix"}, {"text": "Food ministry and state departments; National Health Authority for PM-JAY", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "the Act and PM-JAY rules", "s": [{"title": "National Food Security Act 2013 (Gazette text, PRS copy)", "url": "https://prsindia.org/files/bills_acts/acts_parliament/2013/national-food-security-act-2013.pdf"}, {"title": "NHA: Operation Manual for AB PM-JAY", "url": "https://nha.gov.in/img/resources/Operation%20Manual%20for%20AB%20PM-JAY.pdf"}]}}, {"text": "Size 4 × evidence 2 × movable 2 = 16 of 45", "label": "Why it ranks here", "kids": [{"text": "About 2.7 crore people inside the grain ceiling, plus about 5 crore people aged 70 and over without a PM-JAY card", "label": "Size", "kind": "leaf"}, {"text": "Official lists against a calibrated survey count", "label": "Evidence strength", "kind": "leaf"}, {"text": "Needs state systems", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}, {"text": "1 finding from our analysis", "label": "Research behind it", "kids": [{"text": "Payment tracking reaches the smallest slice of our gap model; proactive eligibility and assisted access the largest", "kids": [{"text": "Our cause model says payment tracking reaches the least of the gap (0.6 to 3.3 points), yet the surveys show large losses after approval. Both can hold: the 20-scheme sample was chosen by unspent budget and mostly measures eligibility and rules, not what households receive. Proactive eligibility is largest in rupees; assisted access reaches a similar or larger share of people.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}], "kind": "hub"}], "kind": "prob", "id": "N1", "rank": 7, "score": 16, "fam": "delivery"}, {"text": "Applications stall or are rejected at verification", "kids": [{"text": "32.64% of the SECC housing list was removed at gram sabhas before the PMAY-G beneficiary list was made.", "label": "What we see", "meta": "Status: Likely", "kind": "see", "basis": {"k": "src", "t": "Source", "x": "PMAY-G records", "s": [{"title": "AwaasSoft report E.4: SECC verification, category-wise (PMAY-G)", "url": "https://report.pmayg.dord.gov.in/netiay/SECCReport/report_categorywiseseccverification.aspx"}]}}, {"text": "3 further data points", "label": "More evidence", "kids": [{"text": "PMAY-G registration then reached 94.0% of the legal list.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "PMAY-G records", "s": [{"title": "AwaasSoft report E.4: SECC verification, category-wise (PMAY-G)", "url": "https://report.pmayg.dord.gov.in/netiay/SECCReport/report_categorywiseseccverification.aspx"}]}}, {"text": "Bihar old-age pension: 2.47% of applications rejected and 3.09% pending.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "state pension records", "s": [{"title": "Bihar SSPMIS: District-wise MVPY progress report", "url": "https://www.sspmis.bihar.gov.in/getDistrictWiseMVPYPublicReport"}]}}, {"text": "Maharashtra Shravan Bal: the beneficiary count fell 31% after the move to direct transfer (Dec 2024).", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "state department records", "s": [{"title": "Economic Survey of Maharashtra 2025-26 (Table 10.98, NSAP schemes)", "url": "https://mls.org.in/PDF2026/budjet/ESM_25_26_Eng%20Book.pdf"}]}}], "kind": "hub"}, {"text": "Approval waits on staff and offices; rejected and pending cases rarely come back.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the approval counts above", "s": []}}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "Verification bottleneck: staff gaps, vacancies, slow approval", "label": "Cause", "meta": "0.6 to 3.2 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "Applications wait for checks, and re-verification and de-duplication drives remove eligible people along with ineligible ones.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the approval counts above and state re-verification drives", "s": []}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}], "kind": "hub"}, {"text": "Track each application to a decision; escalate pending cases", "label": "Possible intervention", "meta": "Proof so far: No Indian trial measuring approvals  ·  By: Block and district offices", "kind": "fix"}, {"text": "State departments; block offices", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "scheme approval rules", "s": []}}, {"text": "Size 2 × evidence 2 × movable 2 = 8 of 45", "label": "Why it ranks here", "kids": [{"text": "0.6 to 3.2 points of the gap; a few percent of applications", "label": "Size", "kind": "leaf"}, {"text": "Official counts", "label": "Evidence strength", "kind": "leaf"}, {"text": "Tracking can be supported", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}], "kind": "prob", "id": "N2", "rank": 11, "score": 8, "fam": "delivery"}], "kind": "stage", "fam": "delivery"}, {"text": "Fulfilment", "label": "Stage 4", "meta": "Is the benefit actually handed over, in full?", "kids": [{"text": "The insurance card is not honoured in private hospitals", "kids": [{"text": "82.7% of insured people's cases in private hospitals got no free care.", "label": "What we see", "meta": "Status: Likely", "kind": "see", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NSS 80th round unit data: insured cases in private hospitals, excluding childbirth, with no free care = 100 − 17.3", "s": [{"title": "MoSPI: NSS Report 596, Household Social Consumption: Health (2025)", "url": "https://www.mospi.gov.in/uploads/publications_reports/publications_reports1776676412084_2b4f2b5c-2f1c-446b-8fa3-ec8f125b2b66_Final_Report_no_596_Health_(2).pdf"}]}}, {"text": "5 further data points", "label": "More evidence", "kids": [{"text": "Free care for insured patients: 96.2% of cases in government hospitals, 17.3% in private ones. Uninsured: 92.8% and 3.9%.", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NSS 80th round unit data", "s": [{"title": "MoSPI: NSS Report 596, Household Social Consumption: Health (2025)", "url": "https://www.mospi.gov.in/uploads/publications_reports/publications_reports1776676412084_2b4f2b5c-2f1c-446b-8fa3-ec8f125b2b66_Final_Report_no_596_Health_(2).pdf"}]}}, {"text": "Out-of-pocket cost per private case: Rs 46,844 for insured patients, Rs 45,268 for uninsured.", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NSS 80th round unit data", "s": [{"title": "MoSPI: NSS Report 596, Household Social Consumption: Health (2025)", "url": "https://www.mospi.gov.in/uploads/publications_reports/publications_reports1776676412084_2b4f2b5c-2f1c-446b-8fa3-ec8f125b2b66_Final_Report_no_596_Health_(2).pdf"}]}}, {"text": "Only 26.7% of card-holding households with a hospital stay report a scheme benefit (India-1 31.4%, India-2 core 24.5%; private-only stays 20.8%, government-only 31.6%).", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "HCES 2023-24 unit data", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}]}}, {"text": "609 private hospitals opted out of PM-JAY: Gujarat 233, Kerala 146, Maharashtra 83.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "press report", "s": [{"title": "Moneylife 2025: 609 private hospitals opted out of Ayushman Bharat PM-JAY", "url": "https://www.moneylife.in/article/ayushman-bharat-scheme-609-private-hospitals-opted-out-due-to-payment-delays-low-reimbursements-since-2018-says-govt/76783.html"}]}}, {"text": "Meghalaya: 69% of 19,459 patients at five private hospitals paid extra (13,418 patients).", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "CAG audit as reported", "s": [{"title": "Moneylife 2023: CAG report on beneficiaries paying under AB-PMJAY", "url": "https://www.moneylife.in/article/cag-report-reveals-beneficiaries-paid-money-for-treatment-under-abpmjay/71710.html"}]}}], "kind": "hub"}, {"text": "At the desk the card is refused, or medicines and tests are billed outside the package.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the scheme rules and the audit above", "s": [{"title": "NHA: Operation Manual for AB PM-JAY", "url": "https://nha.gov.in/img/resources/Operation%20Manual%20for%20AB%20PM-JAY.pdf"}, {"title": "Moneylife 2023: CAG report on beneficiaries paying under AB-PMJAY", "url": "https://www.moneylife.in/article/cag-report-reveals-beneficiaries-paid-money-for-treatment-under-abpmjay/71710.html"}]}}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "The hospital carries the credit risk: paid after treatment, late or at low rates", "label": "Cause", "meta": "Not sized", "kids": [{"text": "Where payment is late or rates are low, the desk rations scheme beds, makes the patient buy medicines and tests, or leaves the scheme. Haryana suspended 650 hospitals over about Rs 490 crore of dues.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "press reports on dues and suspensions", "s": [{"title": "Health Policy Watch, 19 Aug 2025: Haryana hospitals suspend PM-JAY", "url": "https://healthpolicy-watch.news/private-hospitals-suspend-services-for-indias-health-insurance-members-leaving-millions-without-care/"}]}}], "kind": "cause"}, {"text": "Too few empanelled hospitals within reach", "label": "Cause", "meta": "Not sized", "kids": [{"text": "15,733 of 33,270 empanelled hospitals (47%) were private at 31 Dec 2025. Controls it: State Health Agencies.", "kind": "leaf", "basis": {"k": "src", "t": "Source", "x": "Lok Sabha answer", "s": [{"title": "Lok Sabha answers (Feb 2026): 15,733 of 33,270 empanelled hospitals private", "url": "https://sansad.in/getFile/lsapps/loksabhaquestions/annex/187/AS103_jT29ic.pdf?source=lsapps"}]}}], "kind": "cause"}], "kind": "hub"}, {"text": "Before admission, find a hospital that honours the card; raise pre-authorisation at the desk; escalate refusals; record cashless care at discharge", "label": "Possible intervention", "meta": "Proof so far: No Indian trial; a measured pilot would be the first  ·  By: State Health Agencies; hospitals", "kind": "fix"}, {"text": "State Health Agencies, National Health Authority, hospitals", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "PM-JAY guidelines", "s": [{"title": "NHA: Operation Manual for AB PM-JAY", "url": "https://nha.gov.in/img/resources/Operation%20Manual%20for%20AB%20PM-JAY.pdf"}]}}, {"text": "Size 5 × evidence 3 × movable 3 = 45 of 45", "label": "Why it ranks here", "kids": [{"text": "Most private cases of insured people; 48 of every 100 insured cases overall", "label": "Size", "kind": "leaf"}, {"text": "NSS 2025 health microdata, 41,205 insured cases", "label": "Evidence strength", "kind": "leaf"}, {"text": "Desk-level support and escalation act on it directly", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}, {"text": "4 findings from our analysis", "label": "Research behind it", "kids": [{"text": "Insured patients pick private hospitals for trust and quality, not for distance or cost", "kids": [{"text": "The card does not change where people go; people go where they trust. Distance is a small reason partly because only people who reached a hospital are asked; those who could not get there are not in the question.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NSS 2025 health unit data", "s": [{"title": "MoSPI: NSS Report 596, Household Social Consumption: Health (2025)", "url": "https://www.mospi.gov.in/uploads/publications_reports/publications_reports1776676412084_2b4f2b5c-2f1c-446b-8fa3-ec8f125b2b66_Final_Report_no_596_Health_(2).pdf"}]}}, {"text": "Health cover is highest where hospitals are fewest and lowest where they are closest", "kids": [{"text": "Cards were issued where the poor are, not where hospitals are. In Deep India-2 a card has little to be used at; in India-1 it is the supply of empanelled private hospitals that is available, but fewer people hold the card.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NSS 2025 health and NSS Multiple Indicator Survey unit data", "s": [{"title": "MoSPI: NSS Report 596, Household Social Consumption: Health (2025)", "url": "https://www.mospi.gov.in/uploads/publications_reports/publications_reports1776676412084_2b4f2b5c-2f1c-446b-8fa3-ec8f125b2b66_Final_Report_no_596_Health_(2).pdf"}, {"title": "MoSPI microdata: Multiple Indicator Survey, NSS 78th round 2020-21", "url": "https://microdata.gov.in/nada/index.php/catalog/218"}]}}, {"text": "Developed cities look under-insured by government schemes, but their total health cover is as high or higher (61.9% vs 57.0%)", "kids": [{"text": "Part of the urban 'gap' in government cover is substitution by employer, ESIS and private cover, which is the opposite of exclusion. The urban poor specifically are still 7 points behind rural poor, so the rest is real.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "CAMS 2022-23 and NSS 2025 health unit data", "s": [{"title": "MoSPI: Comprehensive Annual Modular Survey 2022-23 (NSS 79th round)", "url": "https://www.mospi.gov.in/sites/default/files/publication_reports/CAMS%20Report_October_N.pdf"}, {"title": "MoSPI: NSS Report 596, Household Social Consumption: Health (2025)", "url": "https://www.mospi.gov.in/uploads/publications_reports/publications_reports1776676412084_2b4f2b5c-2f1c-446b-8fa3-ec8f125b2b66_Final_Report_no_596_Health_(2).pdf"}]}}, {"text": "PM-JAY pays the richest fifth about eight times more per claim than the poorest fifth", "kids": [{"text": "The poor are more often carded and get far smaller claims. Where the money goes depends on treatment type and hospital choice, so card coverage overstates benefit to the poor.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NSS 2025 health unit data, by spending fifth", "s": [{"title": "MoSPI: NSS Report 596, Household Social Consumption: Health (2025)", "url": "https://www.mospi.gov.in/uploads/publications_reports/publications_reports1776676412084_2b4f2b5c-2f1c-446b-8fa3-ec8f125b2b66_Final_Report_no_596_Health_(2).pdf"}]}}], "kind": "hub"}], "kind": "prob", "id": "F1", "rank": 1, "score": 45, "fam": "delivery"}, {"text": "Sanctioned cash is never paid", "kids": [{"text": "52 to 58 of every 100 eligible mothers got no JSY cash, and 48% of likely-eligible poor households have no pension income.", "label": "What we see", "meta": "Status: Likely", "kind": "see", "basis": {"k": "calc", "t": "Our calculation", "x": "JSY: 100 − 41.7% received by name = 58; 100 − 48.0% got any delivery cash = 52 (our analysis of NFHS-5 unit data). Pensions: our analysis of PLFS 2025 unit data", "s": [{"title": "DHS Program: NFHS-5 2019-21 India Report, Volume I (FR375)", "url": "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"}, {"title": "MoSPI microdata: PLFS Calendar Year 2025 (Jan-Dec 2025)", "url": "https://microdata.gov.in/nada/index.php/catalog/284"}, {"title": "NHM: Janani Suraksha Yojana eligibility and cash assistance", "url": "https://nhm.gov.in/index1.php?lang=1&level=3&sublinkid=841&lid=309"}]}}, {"text": "1 further data point", "label": "More evidence", "kids": [{"text": "PMMVY maternity benefit: 89.2% of enrolled women were paid by 31 Mar 2025 (390.23 of 437.49 lakh). There is no count of eligible women behind this.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "Lok Sabha answer", "s": [{"title": "Lok Sabha USQ 5654 (4 Apr 2025): PMMVY status", "url": "https://eparlib.sansad.in/bitstream/123456789/3011039/1/AU5654_T1uj3k.pdf"}]}}], "kind": "hub"}, {"text": "The money is approved but does not reach the account: unseeded or mismatched accounts, unspent releases, rules that differ by state.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the payment rules and the gaps above", "s": [{"title": "NHM: Janani Suraksha Yojana eligibility and cash assistance", "url": "https://nhm.gov.in/index1.php?lang=1&level=3&sublinkid=841&lid=309"}, {"title": "WCD: Mission Shakti Guidelines 2021-22 to 2025-26 (PMMVY 2.0)", "url": "https://pmmvy.wcd.gov.in/WebsiteContent/assets/pdf/Mission%20Shakti%20Guidelines%202021-22%20to%202025-26.pdf"}]}}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Payment rail failure: account inactive or bank rejection", "label": "Cause", "meta": "0 to 0.1 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "Small in the official payment pipeline. Controls it: NPCI, banks.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "payment-failure reports", "s": []}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}, {"text": "Last-mile access: booking, refills, distance to bank or post office", "label": "Cause", "meta": "2.3 to 3.7 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "Delivery or refill does not reach the household; for example cooking-gas customers who never refill. Controls it: Oil companies, distributors, banks.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "cooking-gas refill data", "s": [{"title": "Lok Sabha USQ 3151 (6 Aug 2026): PMUY refill cap", "url": "https://sansad.in/getFile/lsapps/loksabhaquestions/annex/188/AU3151_0ZImcK.pdf?source=lsapps"}]}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}], "kind": "hub"}, {"text": "Before the event, check the person's own account and its Aadhaar mapping; file the claim; track it to credit", "label": "Possible intervention", "meta": "Proof so far: Telangana phone monitoring raised encashment by 1.3 points; Andhra Pradesh smartcards cut leakage by Rs 27 a household a week  ·  By: Welfare and health departments", "kind": "fix", "basis": {"k": "src", "t": "Source", "x": "", "s": [{"title": "Muralidharan, Niehaus, Sukhtankar, Weaver: Phone-based monitoring, Telangana Rythu Bandhu (NBER w25298)", "url": "https://www.nber.org/papers/w25298"}, {"title": "Muralidharan, Niehaus, Sukhtankar 2016: Building State Capacity, biometric smartcards (AER)", "url": "https://www.aeaweb.org/articles?id=10.1257/aer.20141346"}]}}, {"text": "State health societies, welfare departments, NPCI and banks", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "scheme payment rules", "s": [{"title": "NHM: Janani Suraksha Yojana eligibility and cash assistance", "url": "https://nhm.gov.in/index1.php?lang=1&level=3&sublinkid=841&lid=309"}, {"title": "WCD: Mission Shakti Guidelines 2021-22 to 2025-26 (PMMVY 2.0)", "url": "https://pmmvy.wcd.gov.in/WebsiteContent/assets/pdf/Mission%20Shakti%20Guidelines%202021-22%20to%202025-26.pdf"}]}}, {"text": "Size 4 × evidence 3 × movable 3 = 36 of 45", "label": "Why it ranks here", "kids": [{"text": "About 1.4 crore eligible births a year; up to 1.7 crore pensionless households", "label": "Size", "kind": "leaf"}, {"text": "NFHS-5 and PLFS microdata", "label": "Evidence strength", "kind": "leaf"}, {"text": "Account checks and claim tracking act on it directly", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}, {"text": "4 findings from our analysis", "label": "Research behind it", "kids": [{"text": "Mothers who deliver in a private facility are 34 points less likely to report JSY by name", "kids": [{"text": "Where the mother delivers is strongly linked to missing JSY (average reach 42.3%; an association, Tamil Nadu and Puducherry excluded), and young mothers are missed most. A pre-birth helper should steer to a government or accredited facility and check age and papers.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NFHS-5 unit data; regression", "s": [{"title": "DHS Program: NFHS-5 2019-21 India Report, Volume I (FR375)", "url": "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"}]}}, {"text": "Tamil Nadu looks weak on JSY by name, yet 65% of mothers get maternity cash", "kids": [{"text": "A naming question undercounts states with their own maternity cash. Maharashtra is the real low: both numbers are low. State design, not district delivery, drives much of the national figure.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NFHS-5 unit data, six states", "s": [{"title": "DHS Program: NFHS-5 2019-21 India Report, Volume I (FR375)", "url": "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"}]}}, {"text": "Among yearly benefits, the pension is worth most to the poor, yet 48% of likely-eligible poor households have none", "kids": [{"text": "Reach and value run in opposite directions. The scheme the system reaches best is the cheapest to the household; the ones that change a household's year are capped, listed or delayed.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "HCES 2023-24 and PLFS 2025 unit data", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}, {"title": "MoSPI microdata: PLFS Calendar Year 2025 (Jan-Dec 2025)", "url": "https://microdata.gov.in/nada/index.php/catalog/284"}]}}, {"text": "Among eligible old people, the poorest 40% are less likely to get a pension", "kids": [{"text": "Pensions reach the very old, women, SC and ST best, but not the poorest or crowded households, so a poverty-targeted scheme is mildly pro-less-poor inside the eligible group.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "PLFS 2025 unit data; regression", "s": [{"title": "MoSPI microdata: PLFS Calendar Year 2025 (Jan-Dec 2025)", "url": "https://microdata.gov.in/nada/index.php/catalog/284"}]}}], "kind": "hub"}], "kind": "prob", "id": "F2", "rank": 3, "score": 36, "fam": "delivery"}, {"text": "Households get less grain than their entitlement", "kids": [{"text": "Households that receive free grain get 79.8% of their rule quantity on average, and 48.3% of them get at least 95%.", "label": "What we see", "meta": "Status: Unresolved", "kind": "see", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "HCES 2023-24 unit data: free grain received ÷ rule quantity, AAY and priority households that got any", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}]}}, {"text": "3 further data points", "label": "More evidence", "kids": [{"text": "India-1 receiving households get 67.9% of the rule quantity; India-2 core 82.7%.", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "HCES 2023-24 by place group", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}]}}, {"text": "Among all AAY and priority card holders, 44.5% get at least 95% of their entitlement.", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "HCES 2023-24, all AAY and priority card holders", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}]}}, {"text": "17.29% of receiving households got half or less of the rule quantity.", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "HCES 2023-24", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}]}}], "kind": "hub"}, {"text": "The shop machine records who came, not how many kilos left the shop.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the ration-shop machine design", "s": [{"title": "Parliament Standing Committee (Food & PD): action-taken report on ePoS and weighing scales", "url": "https://eparlib.sansad.in/bitstream/123456789/2991477/1/18_Consumer_Affairs_Food_and_Public_Distribution_10.pdf"}]}}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Dealer margin and weighing: the machine records entitlement, not kilos", "label": "Cause", "meta": "Outside the exclusion shares, which count people missed, not kilos; 6.4 to 14.6 points in a rupee-weighted check", "kids": [{"text": "Weighing and dealer margins decide what leaves the shop. Controls it: State food department; the Centre sets the margin norm.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the ration-shop machine design", "s": [{"title": "Parliament Standing Committee (Food & PD): action-taken report on ePoS and weighing scales", "url": "https://eparlib.sansad.in/bitstream/123456789/2991477/1/18_Consumer_Affairs_Food_and_Public_Distribution_10.pdf"}]}}], "kind": "cause"}, {"text": "Family members missing from the card (a hypothesis)", "label": "Cause", "meta": "Not sized", "kids": [{"text": "Households average 80% of entitlement while the national tonnage gap is about 7%, so part of the shortfall may be new members not on the card. Test: card member count against household size. Controls it: State food department.", "kind": "leaf", "basis": {"k": "hypothesis", "t": "Hypothesis, not yet tested", "x": "test: card member count against household size", "s": []}}], "kind": "cause"}], "kind": "hub"}, {"text": "Publish what reaches households, by place; link the shop machine to a scale", "label": "Possible intervention", "meta": "Proof so far: A weighing link was requested by the Centre, not required  ·  By: Food department", "kind": "fix"}, {"text": "State food departments; the Centre sets the dealer margin", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "the food ministry's dealer and machine rules", "s": [{"title": "Parliament Standing Committee (Food & PD): action-taken report on ePoS and weighing scales", "url": "https://eparlib.sansad.in/bitstream/123456789/2991477/1/18_Consumer_Affairs_Food_and_Public_Distribution_10.pdf"}]}}, {"text": "Size 4 × evidence 3 × movable 2 = 24 of 45", "label": "Why it ranks here", "kids": [{"text": "Most of about 79 crore card holders lose some quantity", "label": "Size", "kind": "leaf"}, {"text": "HCES microdata on 83,285 households; official offtake records show more (see Verification)", "label": "Evidence strength", "kind": "leaf"}, {"text": "Weighing and dealer margins need state action", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}, {"text": "1 finding from our analysis", "label": "Research behind it", "kids": [{"text": "Punjab and Gujarat miss many more poor households at the ration shop than Tamil Nadu", "kids": [{"text": "The ration shop works or fails by state design: low-exclusion states such as Tamil Nadu, Telangana and West Bengal run it as a broad service, while richer northern and western states treat it as a targeted one. A card in hand is not use (Rajasthan).", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "HCES 2023-24 unit data, by state", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}]}}], "kind": "hub"}], "kind": "prob", "id": "F3", "rank": 5, "score": 24, "fam": "delivery"}, {"text": "Instalments stop before the full amount is paid", "kids": [{"text": "Only 29% of paid PMMVY women received every instalment; on average they got Rs 4,354 of the Rs 5,000 owed.", "label": "What we see", "meta": "Status: Likely", "kind": "see", "basis": {"k": "src", "t": "Source", "x": "policy brief on programme records", "s": [{"title": "Accountability Initiative, CPR 2023: PMMVY and JSY budget brief 2023-24", "url": "https://accountabilityindia.in/wp-content/uploads/2023/02/PMMVY-JSY-Budget-Briefs-2023.pdf"}]}}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "JSY: 38.7% of eligible births were paid at least the rule amount (India-1 20.1%, Deep India-2 48.2%).", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NFHS-5 unit data against the JSY package", "s": [{"title": "DHS Program: NFHS-5 2019-21 India Report, Volume I (FR375)", "url": "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"}, {"title": "NHM: Janani Suraksha Yojana eligibility and cash assistance", "url": "https://nhm.gov.in/index1.php?lang=1&level=3&sublinkid=841&lid=309"}]}}, {"text": "Cooking gas: Rs 285.5 paid a refill on average against the Rs 300 subsidy.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "petroleum ministry data", "s": [{"title": "Lok Sabha USQ 1901 (30 Jul 2026): LPG/PMUY subsidy", "url": "https://sansad.in/getFile/lsapps/loksabhaquestions/annex/188/AU1901_SwKooe.pdf?source=lsapps"}]}}], "kind": "hub"}, {"text": "Each instalment is a new approval; one stalled step ends the payment.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the instalment rules", "s": [{"title": "WCD: Mission Shakti Guidelines 2021-22 to 2025-26 (PMMVY 2.0)", "url": "https://pmmvy.wcd.gov.in/WebsiteContent/assets/pdf/Mission%20Shakti%20Guidelines%202021-22%20to%202025-26.pdf"}]}}, {"text": "Explained under another problem", "label": "Underlying cause", "kids": [{"text": "Payment rail failure: see 'Sanctioned cash is never paid'", "label": "Shared cause", "kind": "leaf"}], "kind": "hub"}, {"text": "Track each instalment to credit and follow up stalled ones", "label": "Possible intervention", "meta": "Proof so far: No Indian trial  ·  By: Women and child development departments", "kind": "fix"}, {"text": "State departments; the PMMVY portal (2023)", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "the instalment rules", "s": [{"title": "WCD: Mission Shakti Guidelines 2021-22 to 2025-26 (PMMVY 2.0)", "url": "https://pmmvy.wcd.gov.in/WebsiteContent/assets/pdf/Mission%20Shakti%20Guidelines%202021-22%20to%202025-26.pdf"}]}}, {"text": "Size 3 × evidence 1 × movable 3 = 9 of 45", "label": "Why it ranks here", "kids": [{"text": "Lakhs of women a year", "label": "Size", "kind": "leaf"}, {"text": "Programme records reported in a policy brief", "label": "Evidence strength", "kind": "leaf"}, {"text": "Tracking acts on it directly", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}, {"text": "1 finding from our analysis", "label": "Research behind it", "kids": [{"text": "JSY cash is smaller than the delivery bill for four in ten recipients", "kids": [{"text": "JSY is paid, late and thin, and then spent on the delivery itself. Fixing timeliness does not change the fact that it does not cover costs.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NFHS-5 unit data", "s": [{"title": "DHS Program: NFHS-5 2019-21 India Report, Volume I (FR375)", "url": "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"}]}}], "kind": "hub"}], "kind": "prob", "id": "F4", "rank": 10, "score": 9, "fam": "delivery"}, {"text": "Children enrolled for school meals do not eat them", "kids": [{"text": "65.04% of enrolled children in reporting schools ate the mid-day meal on 7 Oct 2026.", "label": "What we see", "meta": "Status: Unresolved", "kind": "see", "basis": {"k": "src", "t": "Source", "x": "PM-POSHAN daily attendance portal", "s": [{"title": "PM POSHAN Automated Monitoring System (AMS) dashboard", "url": "https://pmposhan-ams.education.gov.in/"}]}}, {"text": "1 further data point", "label": "More evidence", "kids": [{"text": "Children received 18.4 meals a month against about 20 school days; 55% got 20 or more (where recorded).", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "HCES 2023-24 unit data", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}]}}], "kind": "hub"}, {"text": "Absence and choice on the day, plus fewer meals than school days in some places.", "label": "Ho
