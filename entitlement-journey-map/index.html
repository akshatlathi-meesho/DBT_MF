w it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the attendance and meal data above", "s": []}}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "Present but not eating: choice or absence", "label": "Cause", "meta": "1.6 to 2.3 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "The meal is served but children are absent or do not eat: food quality, preference, their own lunch. Controls it: Schools; state education department.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the model rows and observed head-counts", "s": []}}], "kind": "cause", "basis": {"k": "model", "t": "Model estimate", "x": "our 20-scheme cause model; see 'Cause shares' in How to read", "s": []}}], "kind": "hub"}, {"text": "No household-level fix from this research", "label": "Possible intervention", "meta": "Proof so far: None", "kind": "fix"}, {"text": "Schools; state education departments", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "PM-POSHAN rules", "s": [{"title": "PM POSHAN PAB (Project Approval Board) minutes page", "url": "https://pmposhan.education.gov.in/PAB_PM_POSHAN.html"}]}}, {"text": "Size 3 × evidence 2 × movable 1 = 6 of 45", "label": "Why it ranks here", "kids": [{"text": "Crores of children, but a one-day attendance figure", "label": "Size", "kind": "leaf"}, {"text": "Official attendance system; HCES with silent clusters", "label": "Evidence strength", "kind": "leaf"}, {"text": "School-level", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}, {"text": "1 finding from our analysis", "label": "Research behind it", "kids": [{"text": "Silent survey clusters make school meals, LPG and insurance cards ranges, not points", "kids": [{"text": "A headline like 'three in four card holders got nothing' depends on whether silent clusters are counted as no. We publish the range and refuse a rank until the item is tested.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "our audit of blank answers across HCES, NSS and NFHS unit data", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}]}}], "kind": "hub"}], "kind": "prob", "id": "F5", "rank": 15, "score": 6, "fam": "delivery"}], "kind": "stage", "fam": "delivery"}, {"text": "Receipt and continued access", "label": "Stage 5", "meta": "Does it arrive on time, under the person's control, and keep coming?", "kids": [{"text": "Eligible people are deleted from the list", "kids": [{"text": "54.4% of resolved ration-card deletion flags turned out to be eligible people.", "label": "What we see", "meta": "Status: Likely", "kind": "see", "basis": {"k": "src", "t": "Source", "x": "food ministry status data", "s": [{"title": "Lok Sabha USQ 1631, 29 Jul 2026 (DFPD): ONORC and Rightful Targeting", "url": "https://sansad.in/getFile/lsapps/loksabhaquestions/annex/188/AU1631_LGpsig.pdf?source=lsapps"}]}}, {"text": "3 further data points", "label": "More evidence", "kids": [{"text": "5.95 crore cards were flagged and 2.35 crore deleted in the 2026 rightful-targeting drive.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "food ministry", "s": [{"title": "Lok Sabha USQ 1631, 29 Jul 2026 (DFPD): ONORC and Rightful Targeting", "url": "https://sansad.in/getFile/lsapps/loksabhaquestions/annex/188/AU1631_LGpsig.pdf?source=lsapps"}]}}, {"text": "MGNREGA: about 7.8 crore workers deleted in FY2022-24; 1.16 crore job cards added back net in FY2024-25 after a reinstatement procedure.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "LibTech India tracker", "s": [{"title": "LibTech India 2025: The Missing Work, national MGNREGA review FY2024-25", "url": "https://cordindia.com/wp-content/uploads/2025/06/LibTech_India_Tracker_FY-2024-25-English.pdf"}]}}, {"text": "Uttar Pradesh pensions: 1.77 lakh people removed as deceased or ineligible in 2024 and 3.32 lakh in 2025.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "state minister's statement", "s": [{"title": "Outlook Money, 30 Dec 2025: UP old age pension removals", "url": "https://www.outlookmoney.com/news/old-age-pension-in-uttar-pradesh-around-1-mln-beneficiaries-added-in-8-months-total-reaches-675-mln"}]}}], "kind": "hub"}, {"text": "Clean-up drives remove names in bulk; nobody owns list accuracy, and freed slots are not refilled.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the deletion records above", "s": [{"title": "Lok Sabha USQ 1631, 29 Jul 2026 (DFPD): ONORC and Rightful Targeting", "url": "https://sansad.in/getFile/lsapps/loksabhaquestions/annex/188/AU1631_LGpsig.pdf?source=lsapps"}, {"title": "LibTech India 2025: The Missing Work, national MGNREGA review FY2024-25", "url": "https://cordindia.com/wp-content/uploads/2025/06/LibTech_India_Tracker_FY-2024-25-English.pdf"}]}}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "Renewal or re-verification drops people (eKYC drives, life certificates)", "label": "Cause", "meta": "Sized at 0 in the 20-scheme model, which counts people never enrolled", "kids": [{"text": "Seeding drives and yearly life-certificate checks delete living people along with the dead; an old person with worn fingerprints cannot fix it alone.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the deletion records above", "s": [{"title": "Outlook Money, 30 Dec 2025: UP old age pension removals", "url": "https://www.outlookmoney.com/news/old-age-pension-in-uttar-pradesh-around-1-mln-beneficiaries-added-in-8-months-total-reaches-675-mln"}]}}], "kind": "cause"}], "kind": "hub"}, {"text": "Check before deletion; help people file for reinstatement after it", "label": "Possible intervention", "meta": "Proof so far: No Indian trial", "kind": "fix"}, {"text": "State departments", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "state list rules", "s": []}}, {"text": "Size 4 × evidence 2 × movable 3 = 24 of 45", "label": "Why it ranks here", "kids": [{"text": "5.95 crore cards flagged, 2.35 crore deleted", "label": "Size", "kind": "leaf"}, {"text": "Food ministry status data", "label": "Evidence strength", "kind": "leaf"}, {"text": "Reinstatement support acts on it directly", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}], "kind": "prob", "id": "R3", "rank": 5, "score": 24, "fam": "delivery"}, {"text": "Payments arrive late", "kids": [{"text": "37.3% of JSY recipients were paid more than 30 days after delivery, and 31.4% within 7 days.", "label": "What we see", "meta": "Status: Likely", "kind": "see", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NFHS-5 unit data, mothers who received JSY", "s": [{"title": "DHS Program: NFHS-5 2019-21 India Report, Volume I (FR375)", "url": "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"}]}}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "Paid within 7 days: 31.0% of mothers with their own bank account against 36.2% without. The gap stays at 5.8 to 6.1 points after allowing for interviewer effects.", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NFHS-5 unit data; regression with interviewer fixed effects", "s": [{"title": "DHS Program: NFHS-5 2019-21 India Report, Volume I (FR375)", "url": "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"}]}}, {"text": "PM-JAY: 40.23 lakh claims worth Rs 6,052 crore were awaiting a decision in Nov 2022.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "audit report", "s": [{"title": "CAG Report No. 11 of 2023: PM-JAY performance audit", "url": "https://cag.gov.in/en/audit-report/details/119060"}]}}], "kind": "hub"}, {"text": "Releases move through state treasuries and two-step approvals; no scheme publishes the date the money reached the person.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the payment rules and audit above", "s": [{"title": "NHM: Janani Suraksha Yojana eligibility and cash assistance", "url": "https://nhm.gov.in/index1.php?lang=1&level=3&sublinkid=841&lid=309"}, {"title": "CAG Report No. 11 of 2023: PM-JAY performance audit", "url": "https://cag.gov.in/en/audit-report/details/119060"}]}}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "State release cycles and two-step approvals", "label": "Cause", "meta": "Not sized", "kids": [{"text": "Money moves through state treasuries and a two-signatory step, so delay follows state capacity and central release timing.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the audit and treasury rules above", "s": [{"title": "CAG Report No. 11 of 2023: PM-JAY performance audit", "url": "https://cag.gov.in/en/audit-report/details/119060"}]}}], "kind": "cause"}, {"text": "Budget released late", "label": "Cause", "meta": "Not sized in the sample", "kids": [{"text": "No share could be measured in the 20 schemes. Controls it: Department of Expenditure; states.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the model; no share measured", "s": []}}], "kind": "cause"}], "kind": "hub"}, {"text": "Track the payment date and escalate delays", "label": "Possible intervention", "meta": "Proof so far: Bihar MGNREGA trial (2012-13): a fund-flow reform added 20.4 days (+38%) of delay, so system fixes can backfire  ·  By: State treasuries; departments", "kind": "fix", "basis": {"k": "src", "t": "Source", "x": "", "s": [{"title": "Banerjee, Duflo, Imbert, Mathew, Pande 2020: E-governance, Accountability and Leakage (AEJ Applied)", "url": "https://www.aeaweb.org/articles?id=10.1257/app.20180302"}]}}, {"text": "State treasuries, health societies, the Centre", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "scheme payment rules", "s": [{"title": "NHM: Janani Suraksha Yojana eligibility and cash assistance", "url": "https://nhm.gov.in/index1.php?lang=1&level=3&sublinkid=841&lid=309"}]}}, {"text": "Size 3 × evidence 2 × movable 2 = 12 of 45", "label": "Why it ranks here", "kids": [{"text": "A third of JSY recipients", "label": "Size", "kind": "leaf"}, {"text": "NFHS-5 recall, bunched on round numbers of days (national value only)", "label": "Evidence strength", "kind": "leaf"}, {"text": "Tracking helps; release cycles are state finance", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}], "kind": "prob", "id": "R1", "rank": 8, "score": 12, "fam": "delivery"}, {"text": "Someone else controls or takes the money", "kids": [{"text": "17.8% of people paid into an account had a friend or family member withdraw the money, and 10.0% paid an unexpected fee to withdraw (both lower bounds).", "label": "What we see", "meta": "Status: Likely", "kind": "see", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "Global Findex 2025 India unit data", "s": [{"title": "World Bank Microdata Library: Global Findex 2025, India", "url": "https://microdata.worldbank.org/catalog/7916"}]}}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "79.7% of government-support and pension recipients are paid into an account or by phone (756 recipients).", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "Global Findex 2025 India unit data", "s": [{"title": "World Bank Microdata Library: Global Findex 2025, India", "url": "https://microdata.worldbank.org/catalog/7916"}]}}, {"text": "Women with money they alone decide on: 50.5% in India-2 core, 57.4% in India-1.", "kind": "ev", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NFHS-5 unit data, women 15 to 49", "s": [{"title": "DHS Program: NFHS-5 2019-21 India Report, Volume I (FR375)", "url": "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"}]}}], "kind": "hub"}, {"text": "Cash-out depends on agents, phones and skills the beneficiary may not have, so others do it for them.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the payment data above and the research below", "s": []}}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Control of the money inside the household", "label": "Cause", "meta": "Not sized", "kids": [{"text": "The money arrives but the beneficiary does not control it. Controls it: Households; frontline workers.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the women's money-control data above", "s": [{"title": "DHS Program: NFHS-5 2019-21 India Report, Volume I (FR375)", "url": "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"}]}}], "kind": "cause"}, {"text": "Cash-out access: agents, fees, distance, digital skills", "label": "Cause", "meta": "Not sized", "kids": [{"text": "Fees, agents and digital barriers decide whether the money can be taken out cheaply and alone. Controls it: Banks, business correspondents, NPCI.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the payment data above", "s": [{"title": "World Bank Microdata Library: Global Findex 2025, India", "url": "https://microdata.worldbank.org/catalog/7916"}]}}], "kind": "cause"}], "kind": "hub"}, {"text": "Voice-first support for women to cash out from their own account", "label": "Possible intervention", "meta": "Proof so far: Field, Pande and others: women's own accounts raised their financial agency (a study outside this sample)  ·  By: Banks, business correspondents", "kind": "fix", "basis": {"k": "src", "t": "Source", "x": "", "s": [{"title": "Field, Pande, Rigol, Schaner, Troyer Moore 2021: On Her Own Account (AER)", "url": "https://www.aeaweb.org/articles?id=10.1257/aer.20200705"}]}}, {"text": "Banks, business correspondents, NPCI; households", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "banking-correspondent rules", "s": []}}, {"text": "Size 3 × evidence 1 × movable 2 = 6 of 45", "label": "Why it ranks here", "kids": [{"text": "About 1 in 6 recipients; 3 in 4 adults cannot pay digitally", "label": "Size", "kind": "leaf"}, {"text": "Findex 2025, a lower bound", "label": "Evidence strength", "kind": "leaf"}, {"text": "Skills and channels can be supported", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}, {"text": "4 findings from our analysis", "label": "Research behind it", "kids": [{"text": "Women get government money more often than men, but others withdraw it for them nearly twice as often", "kids": [{"text": "Women are the main recipients but not the main controllers of the money. A woman-focused helper should check who actually withdraws, not just whether the account is in her name.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "Global Findex 2025 India unit data", "s": [{"title": "World Bank Microdata Library: Global Findex 2025, India", "url": "https://microdata.worldbank.org/catalog/7916"}]}}, {"text": "Government payments go digital while three in four adults cannot pay digitally", "kids": [{"text": "The payment rail has gone digital faster than the users. The gap is filled by relatives, agents and shopkeepers, which is where fees, delay and loss of control come in.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "CAMS 2022-23 and Global Findex 2025 unit data", "s": [{"title": "MoSPI: Comprehensive Annual Modular Survey 2022-23 (NSS 79th round)", "url": "https://www.mospi.gov.in/sites/default/files/publication_reports/CAMS%20Report_October_N.pdf"}, {"title": "World Bank Microdata Library: Global Findex 2025, India", "url": "https://microdata.worldbank.org/catalog/7916"}]}}, {"text": "Women hold accounts almost as often as men but bank online far less", "kids": [{"text": "The account is no longer the barrier; use is. Digital-skills and trusted-agent support matters far more than opening accounts.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NSS telecom survey unit data; regression", "s": [{"title": "MoSPI: Comprehensive Modular Survey Telecom 2025, press note", "url": "https://www.mospi.gov.in/sites/default/files/press_release/Final_press%20release_CMS_T.pdf"}]}}, {"text": "In the poorest districts only about a third of women own a phone, and one in ten owners uses it for money", "kids": [{"text": "In the places where assisted access matters, half the women cannot travel alone to a service point and only one in ten phone owners moves money. Doorstep or voice help beats a centre.", "label": "What it means (our reading)", "kind": "leaf"}], "kind": "inf", "basis": {"k": "analysis", "t": "Our analysis of survey data", "x": "NFHS-5 unit data", "s": [{"title": "DHS Program: NFHS-5 2019-21 India Report, Volume I (FR375)", "url": "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"}]}}], "kind": "hub"}], "kind": "prob", "id": "R2", "rank": 15, "score": 6, "fam": "delivery"}, {"text": "Complaints are not resolved", "kids": [{"text": "42.3% of grievances in six sample states were still pending: 69,300 of 164,004, from 1 Jan to 30 Jun 2026.", "label": "What we see", "meta": "Status: Unresolved", "kind": "see", "basis": {"k": "calc", "t": "Our calculation", "x": "pending cases summed over six states ÷ all cases in those states, CPGRAMS", "s": [{"title": "DARPG: CPGRAMS Monthly Report States/UTs, June 2026 (No. 47)", "url": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/jul/doc2026729936201.pdf"}]}}, {"text": "1 further data point", "label": "More evidence", "kids": [{"text": "Old-age and widow pensions (NSAP): 2,249 grievances received and 2,178 disposed from FY2020-21 to Jan 2026, against 3.09 crore beneficiaries.", "kind": "ev", "basis": {"k": "src", "t": "Source", "x": "Lok Sabha answer", "s": [{"title": "Lok Sabha USQ 1831 (10 Feb 2026): NSAP grievances on CPGRAMS", "url": "https://sansad.in/getFile/lsapps/loksabhaquestions/annex/187/AU1831_Xj0Ejw.pdf?source=lsapps"}]}}], "kind": "hub"}, {"text": "Grievance systems count cases filed and closed, not whether the benefit then arrived.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the grievance data above", "s": [{"title": "DARPG: CPGRAMS Monthly Report States/UTs, June 2026 (No. 47)", "url": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/jul/doc2026729936201.pdf"}]}}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "Weak complaint system", "label": "Cause", "meta": "Not sized", "kids": [{"text": "Complaints are logged but not tied to a deadline or an outcome.", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the grievance data above", "s": []}}], "kind": "cause"}], "kind": "hub"}, {"text": "File and follow complaints on the person's behalf", "label": "Possible intervention", "meta": "Proof so far: No Indian trial  ·  By: Grievance cells", "kind": "fix"}, {"text": "State and central grievance cells", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "grievance rules", "s": [{"title": "DARPG: CPGRAMS Monthly Report States/UTs, June 2026 (No. 47)", "url": "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/jul/doc2026729936201.pdf"}]}}, {"text": "Size 2 × evidence 1 × movable 3 = 6 of 45", "label": "Why it ranks here", "kids": [{"text": "Lakhs of cases", "label": "Size", "kind": "leaf"}, {"text": "Grievance portal counts", "label": "Evidence strength", "kind": "leaf"}, {"text": "Direct", "label": "How movable", "kind": "leaf"}], "kind": "hub", "basis": {"k": "judgement", "t": "Judgement", "x": "our scoring against the rubric in How to read; size uses the figures above", "s": []}}], "kind": "prob", "id": "R4", "rank": 15, "score": 6, "fam": "delivery"}], "kind": "stage", "fam": "delivery"}, {"text": "Verification and accountability", "label": "Across every stage", "meta": "Does anyone check what reached the household?", "kids": [{"text": "Records count approvals and transactions, not receipt", "kids": [{"text": "Of 20 sampled schemes, 19 publish no share of people paid in full, 17 no on-time measure, 15 no count of unique people paid and 12 no failure codes.", "label": "What we see", "meta": "Status: Established", "kind": "see", "basis": {"k": "review", "t": "Our review of public records", "x": "each of the 20 schemes' public dashboards, annual reports and rules, Aug to Oct 2026", "s": []}}, {"text": "3 further data points", "label": "More evidence", "kids": [{"text": "12 of the 20 schemes set no time rule for the benefit.", "kind": "ev", "basis": {"k": "review", "t": "Our review of public records", "x": "the same 20 schemes", "s": []}}, {"text": "JSY: official records show 69.1% of eligible births paid (2023-24); the household survey finds 41.7% received JSY by name (2019-21). The years differ.", "kind": "ev", "basis": {"k": "calc", "t": "Our calculation", "x": "official 69.1% against the survey's 41.7%; different years", "s": [{"title": "MoHFW: HMIS portal (Integrated Health Information Platform)", "url": "https://hmis.mohfw.gov.in/"}, {"title": "DHS Program: NFHS-5 2019-21 India Report, Volume I (FR375)", "url": "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"}]}}, {"text": "Free grain: households report 78.2% of the rule quantity across all receiving households (2023-24) against 93.68% of rule tonnes in official offtake records (2026, our calculation), a ratio of 0.835.", "kind": "ev", "basis": {"k": "calc", "t": "Our calculation", "x": "93.68% = official offtake ÷ rule tonnes from food ministry data; then 78.19 ÷ 93.68 = 0.835", "s": [{"title": "MoSPI: HCES 2023-24 press note and fact sheet", "url": "https://www.mospi.gov.in/sites/default/files/press_release/HCES_Press_Note_2023-24_27122024_rev.pdf"}, {"title": "Food ministry IMPDS allocation and offtake data (live dashboard)", "url": "https://impds.nic.in/sale"}]}}], "kind": "hub"}, {"text": "Every scheme records what it approved or released. None records the quantity or date that reached the household, so losses after approval never appear in official figures.", "label": "How it fails", "kind": "leaf", "basis": {"k": "reading", "t": "Our reading of", "x": "the three comparisons above", "s": []}}, {"text": "Measure receipt: paid in full, days to credit, cashless care at discharge; publish by place", "label": "Possible intervention", "meta": "Proof so far: The gaps between records and households above all point the same way  ·  By: Scheme owners", "kind": "fix"}, {"text": "Scheme owners at Union and state level", "label": "Who controls the change", "kind": "who", "basis": {"k": "reading", "t": "Our reading of", "x": "scheme reporting rules", "s": []}}, {"text": "1 finding from our analysis", "label": "Research behind it", "kids": [{"text": "Survey and central list agree on ration-card holders nationally but disagree by state", "kids": [{"text": "A national match hides state mismatch. Where states run their own univ dence 1: suggestive: small or old studies, relayed figures. Movable 3: an outside actor can help directly (assist, track, escalate) with the state's cooperation; movable 1: only a change in law, budget or policy moves it."], ["Status labels.", "Established: shown directly by the evidence. Likely: consistent evidence, but the mechanism is not proven case by case. Unresolved: competing explanations not yet separated."], ["Places.", "India-1: metros and the urban parts of the most developed fifth of districts. India-2 core: rural and small-town areas of the three least developed fifths of districts. Deep India-2: the poorest 40% of people within India-2 core."], ["Cause shares (the model).", "For each of 20 schemes in six states, picked by unspent money, we measured the gap between people eligible and people reached, assigned parts of it to causes where the evidence for that scheme supports it, and kept the rest as not explained. Shares are points of that gap. They are ranges, they need not add to 100, and they lean towards causes tied to money and rules. They describe the sample, not all of India."], ["Read across, not down.", "Each problem is a separate estimate from a different scheme, survey and year. Do not add them up or read them as one funnel."], ["Survey years.", "HCES 2023-24, NFHS-5 2019-21, PLFS 2025, NSS health survey 2025, CAMS 2022-23, NSS Multiple Indicator Survey 2020-21, Global Findex 2025 (2024 fieldwork). Official records to Oct 2026. Data as of 10 Oct 2026."]]};
const NS = "http://www.w3.org/2000/svg";
const COLW = [250, 220, 300, 340, 340, 320], GAPX = 64, GAPY = 12, PADX = 13, PADY = 10;
const FONTS = {
  root:  {t:"600 20px Lora, Georgia, serif", lh:26},
  stage: {t:"600 17px Lora, Georgia, serif", lh:22},
  prob:  {t:"600 15px 'Source Sans 3', sans-serif", lh:20},
  other: {t:"400 13.5px 'Source Sans 3', sans-serif", lh:18.5},
  meta:  {t:"400 12.5px 'Source Sans 3', sans-serif", lh:17},
  metaI: {t:"italic 400 13px 'Source Sans 3', sans-serif", lh:17},
  bas:   {t:"400 12px 'Source Sans 3', sans-serif", lh:16},
  lnk:   {t:"600 12px 'Source Sans 3', sans-serif", lh:16},
};
const ctx = document.createElement("canvas").getContext("2d");
function wrap(str, font, maxW) {
  ctx.font = font; const out = []; let line = "";
  for (const w of String(str).split(/\s+/)) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line); return out;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// index nodes, carry branch family down
(function walk(n, path, depth, fam) {
  n.path = path; n.depth = depth; n.fam = n.fam || fam || "design";
  (n.kids || []).forEach((k, i) => walk(k, path + "." + i, depth + 1, n.fam));
})(TREE, "0", 0, null);
const byPath = {};
(function idx(n){ byPath[n.path] = n; (n.kids||[]).forEach(idx); })(TREE);

let open = new Set(["0", ...TREE.kids.map(k => k.path)]);
let zoom = 1;

function measure(n) {
  const w = COLW[Math.min(n.depth, COLW.length - 1)];
  const inner = w - PADX * 2 - (n.kind === "prob" ? 4 : 0) - (n.kids ? 16 : 0);
  const f = FONTS[n.kind] || FONTS.other;
  n.w = w; n.tl = wrap(n.text, f.t, inner); n.f = f;
  n.ml = n.meta ? wrap(n.meta, (n.kind === "stage" ? FONTS.metaI : FONTS.meta).t, inner) : [];
  let h = PADY * 2 + n.tl.length * f.lh;
  if (n.label || n.kind === "prob") h += 16;
  if (n.kind === "prob" && n.score) h += 10;
  if (n.ml.length) h += 4 + n.ml.length * FONTS.meta.lh;
  n.bl = []; n.ll = [];
  if (n.basis) {
    n.bl = n.basis.x ? wrap(n.basis.x, FONTS.bas.t, inner) : [];
    n.ll = n.basis.s.map(s => ({url: s.url, lines: wrap((s.url ? "↗ " : "") + s.title + (s.url ? "" : " (no public link)"), FONTS.lnk.t, inner)}));
    h += 9 + 13 + n.bl.length * FONTS.bas.lh + n.ll.reduce((a, l) => a + l.lines.length * FONTS.lnk.lh + 2, 0);
  }
  n.h = Math.round(h);
}
function sub(n) {
  measure(n);
  const ks = open.has(n.path) ? (n.kids || []) : [];
  n.vk = ks;
  if (!ks.length) return n.sh = n.h;
  const total = ks.reduce((s, k) => s + sub(k), 0) + GAPY * (ks.length - 1);
  return n.sh = Math.max(n.h, total);
}
function place(n, top, x) {
  n.x = x; n.y = top + (n.sh - n.h) / 2;
  const total = n.vk.reduce((s, k) => s + k.sh, 0) + GAPY * Math.max(0, n.vk.length - 1);
  let y = top + (n.sh - total) / 2;
  for (const k of n.vk) { place(k, y, x + n.w + GAPX); y += k.sh + GAPY; }
}
const famVar = f => `var(--${f})`;
const tintVar = f => `var(--${f}-t)`;
const LABCOL = {fix: "var(--fix)", who: "var(--who)"};

function nodeSVG(n) {
  const c = famVar(n.fam), isOpen = open.has(n.path) && n.kids;
  let fill = "var(--card)", stroke = "var(--line)", ink = "";
  if (n.kind === "root") { fill = "var(--root)"; stroke = "var(--root)"; ink = ";fill:var(--root-ink)"; }
  if (n.kind === "stage") { fill = tintVar(n.fam); stroke = c; }
  let s = `<g class="n" data-p="${n.path}" transform="translate(${n.x},${n.y})" tabindex="0" role="treeitem"${n.kids ? ` aria-expanded="${!!isOpen}"` : ""}>`;
  s += `<rect class="box" width="${n.w}" height="${n.h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="${n.kind === "stage" ? 1.5 : 1}"/>`;
  let x = PADX, y = PADY;
  if (n.kind === "prob") {
    s += `<rect width="4" height="${n.h - 12}" x="6" y="6" rx="2" fill="${c}"/>`; x += 4;
    const lab = n.score ? `Rank ${n.rank} of 19 · score ${n.score}/45` : "Cuts across all stages";
    s += `<text class="lab" x="${x}" y="${y + 11}" style="fill:${c}">${lab}</text>`; y += 16;
    if (n.score) {
      const bw = n.w - x - PADX - 10;
      s += `<rect x="${x}" y="${y + 1}" width="${bw}" height="5" rx="2.5" fill="var(--bar-bg)"/><rect x="${x}" y="${y + 1}" width="${bw * n.score / 45}" height="5" rx="2.5" fill="${c}"/>`;
      y += 10;
    }
  } else if (n.label) {
    s += `<text class="lab" x="${x}" y="${y + 11}" style="fill:${n.kind === "root" ? "var(--root-ink)" : (LABCOL[n.kind] || c)}">${esc(n.label)}</text>`; y += 16;
  }
  const ff = n.f.t;
  n.tl.forEach((l, i) => { s += `<text x="${x}" y="${y + n.f.lh * (i + .78)}" style="font:${ff}${ink}">${esc(l)}</text>`; });
  y += n.tl.length * n.f.lh;
  if (n.ml.length) {
    y += 4; const mf = n.kind === "stage" ? FONTS.metaI.t : FONTS.meta.t;
    n.ml.forEach((l, i) => { s += `<text class="meta" x="${x}" y="${y + FONTS.meta.lh * (i + .78)}" style="font:${mf}${n.kind === "root" ? ";fill:var(--root-ink);opacity:.85" : ""}">${esc(l)}</text>`; });
  }
  if (n.basis) {
    y += n.ml.length ? n.ml.length * FONTS.meta.lh : 0;
    y += 5; s += `<line class="sep" x1="${x}" x2="${n.w - PADX}" y1="${y}" y2="${y}"/>`; y += 4;
    s += `<text class="bt" x="${x}" y="${y + 10}" style="fill:var(--b-${n.basis.k})">${esc(n.basis.t)}</text>`; y += 13;
    n.bl.forEach((l, i) => { s += `<text class="bx" x="${x}" y="${y + FONTS.bas.lh * (i + .78)}" style="font:${FONTS.bas.t}">${esc(l)}</text>`; });
    y += n.bl.length * FONTS.bas.lh;
    for (const L of n.ll) {
      const body = L.lines.map((l, i) => `<text class="${L.url ? "lnk" : "nolink"}" x="${x}" y="${y + FONTS.lnk.lh * (i + .78)}" style="font:${FONTS.lnk.t}">${esc(l)}</text>`).join("");
      s += L.url ? `<a href="${esc(L.url)}" target="_blank" rel="noopener noreferrer">${body}</a>` : body;
      y += L.lines.length * FONTS.lnk.lh + 2;
    }
  }
  if (n.kids) {
    s += `<g class="tog" transform="translate(${n.w},${n.h / 2})"><circle r="10"/><text text-anchor="middle" y="4">${isOpen ? "−" : n.kids.length}</text></g>`;
  }
  return s + "</g>";
}
function linkSVG(p, k) {
  const x1 = p.x + p.w + 10, y1 = p.y + p.h / 2, x2 = k.x, y2 = k.y + k.h / 2, mx = (x1 + x2) / 2;
  const sw = [3, 2.4, 1.8, 1.4, 1.2, 1.2][p.depth] || 1.2;
  return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${famVar(k.fam)}" stroke-opacity=".5" stroke-width="${sw}"/>`;
}
const svg = document.getElementById("map"), wrapEl = document.getElementById("wrap");
let W = 0, H = 0;
function render() {
  sub(TREE); place(TREE, 20, 20);
  if (TREE.vk.length) TREE.y = Math.max(20, TREE.vk[0].y - 10);  // root sits at the top so the reader starts at stage 1
  let links = "", nodes = "";
  (function draw(n) {
    W = Math.max(W, n.x + n.w + 40); H = Math.max(H, n.y + n.h + 40);
    for (const k of n.vk) { links += linkSVG(n, k); draw(k); }
    nodes += nodeSVG(n);
  })((W = 0, H = 0, TREE));
  H = Math.max(H, TREE.sh + 40);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W * zoom); svg.setAttribute("height", H * zoom);
  svg.innerHTML = links + nodes;
}
function toggle(path) {
  const n = byPath[path]; if (!n || !n.kids) return;
  const before = n.y;
  if (open.has(path)) [...open].forEach(p => (p === path || p.startsWith(path + ".")) && open.delete(p));
  else open.add(path);
  render();
  wrapEl.scrollTop += (n.y - before) * zoom;
  const g = svg.querySelector(`[data-p="${path}"]`); if (g) g.focus({preventScroll: true});
}
svg.addEventListener("click", e => { if (moved || e.target.closest("a")) return; const g = e.target.closest(".n"); if (g) toggle(g.dataset.p); });
svg.addEventListener("keydown", e => {
  if (e.target.closest("a")) return;
  const g = e.target.closest(".n"); if (!g) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(g.dataset.p); }
});
// drag to pan (mouse only; touch scrolls natively)
let drag = null, moved = false;
wrapEl.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || e.button) return; drag = {x: e.clientX, y: e.clientY, l: wrapEl.scrollLeft, t: wrapEl.scrollTop}; moved = false; });
addEventListener("pointermove", e => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 5) return;
  moved = true; wrapEl.classList.add("drag"); wrapEl.scrollLeft = drag.l - dx; wrapEl.scrollTop = drag.t - dy;
});
addEventListener("pointerup", () => { drag = null; wrapEl.classList.remove("drag"); setTimeout(() => moved = false, 0); });

function setZoom(z) {
  const cx = (wrapEl.scrollLeft + wrapEl.clientWidth / 2) / zoom, cy = (wrapEl.scrollTop + wrapEl.clientHeight / 2) / zoom;
  zoom = Math.min(1.6, Math.max(0.4, z)); render();
  wrapEl.scrollLeft = cx * zoom - wrapEl.clientWidth / 2; wrapEl.scrollTop = cy * zoom - wrapEl.clientHeight / 2;
}
document.getElementById("zin").onclick = () => setZoom(zoom * 1.2);
document.getElementById("zout").onclick = () => setZoom(zoom / 1.2);
document.getElementById("close").onclick = () => { open = new Set(["0", ...TREE.kids.map(k => k.path)]); render(); wrapEl.scrollTo(0, 0); };
document.getElementById("top3").onclick = () => {
  const probs = Object.values(byPath).filter(n => n.kind === "prob" && n.rank).sort((a, b) => b.score - a.score).slice(0, 3);
  open = new Set(["0", ...TREE.kids.map(k => k.path), ...probs.map(p => p.path)]);
  render();
  const first = probs.reduce((a, b) => a.y < b.y ? a : b);
  wrapEl.scrollTo({left: Math.max(0, (first.x - 40) * zoom - 200), top: Math.max(0, (first.y - 30) * zoom), behavior: "smooth"});
};
document.getElementById("notes").innerHTML = TREE.notes.map(([h, b]) => `<p><b>${esc(h)}</b> ${esc(b)}</p>`).join("");

if (innerWidth < 700) zoom = 0.8;
const fontsReady = Promise.all([FONTS.root.t, FONTS.prob.t, FONTS.other.t, FONTS.metaI.t, "700 10.5px 'Source Sans 3'"].map(f => document.fonts.load(f).catch(() => 0)));
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(render);
render();
</script>
