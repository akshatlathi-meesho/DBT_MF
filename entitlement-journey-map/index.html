ashtra pensions hold no AAY or BPL card, which the rule asks for unless family income is under Rs 21,000 a year: 41.8 to 78.5% for Shravan Bal and 40.7 to 63.7% for Sanjay Gandhi Niradhar.", "label": "What we see", "meta": "Source: Our cut of HCES 2023-24 (MoSPI household consumption survey) and PLFS 2025  ·  Likely", "kind": "see"}, {"text": "The card is the entry test, so a poor person without one is ineligible on paper.", "label": "How it fails", "kind": "leaf"}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "Rules too narrow or unclear", "label": "Cause", "meta": "0.3 to 4.9 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "Income tests, age limits or card routes leave out poor people who are not on an old list. Controls it: Cabinet and state governments.", "kind": "leaf"}], "kind": "cause"}], "kind": "hub"}, {"text": "Help people get the qualifying card, then apply", "label": "Possible intervention", "meta": "Proof so far: The Delhi trial under rank 1 found documents were the binding step  ·  By: Frontline staff; assisted channels", "kind": "fix"}, {"text": "State governments for the rule; revenue offices for the cards", "label": "Who controls the change", "kind": "who"}, {"text": "Size 2 × evidence 2 × movable 2 = 8 of 45", "label": "Why it ranks here", "kids": [{"text": "Lakhs of people per state scheme", "label": "Size", "kind": "leaf"}, {"text": "A survey cut of excluded people; card labels differ by state", "label": "Evidence strength", "kind": "leaf"}, {"text": "Partly: card access can be supported", "label": "How movable", "kind": "leaf"}], "kind": "hub"}], "kind": "prob", "id": "E4", "rank": 11, "score": 8, "fam": "design"}, {"text": "Seats and funded slots are far below the eligible pool", "kids": [{"text": "Seats cover only 2.6 to 2.8% of the eligible tribal student pool in Eklavya schools at full build, and 4.6 to 7.0% of the pool for Andhra Pradesh SC and BC hostels.", "label": "What we see", "meta": "Source: Scheme documents against survey-based pools, 2025-26  ·  Established", "kind": "see"}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "Mid-day meals: the approved 2025-26 plan funds 71.09% of enrolment.", "meta": "Source: PM-POSHAN approval board plan 2025-26", "kind": "ev"}, {"text": "Cooking gas: the cap on subsidised refills fell from 12 a year (May 2022) to 9 (2025-26) and 4 (announced Aug 2026). Average use was 4.71 refills a connection in 2025-26, above the new cap.", "meta": "Source: Petroleum ministry, PMUY data", "kind": "ev"}], "kind": "hub"}, {"text": "A scheme with a fixed number of seats, meals or refills cannot reach everyone it is meant for.", "label": "How it fails", "kind": "leaf"}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "The budget fixes the number of seats, meals or refills", "label": "Cause", "meta": "Not sized in the 20-scheme model", "kids": [{"text": "The cap comes from the budget and the scheme guidelines, not from the size of the eligible pool.", "kind": "leaf"}], "kind": "cause"}], "kind": "hub"}, {"text": "Show each cap against the eligible pool in budget discussions", "label": "Possible intervention", "meta": "Proof so far: No trial  ·  By: Research", "kind": "fix"}, {"text": "Union ministries and the finance ministry", "label": "Who controls the change", "kind": "who"}, {"text": "Size 3 × evidence 2 × movable 1 = 6 of 45", "label": "Why it ranks here", "kids": [{"text": "Pools of 1 to 13 crore people with caps far below them", "label": "Size", "kind": "leaf"}, {"text": "Scheme documents and survey-based pools", "label": "Evidence strength", "kind": "leaf"}, {"text": "Budget and design", "label": "How movable", "kind": "leaf"}], "kind": "hub"}], "kind": "prob", "id": "E3", "rank": 15, "score": 6, "fam": "design"}], "kind": "stage", "fam": "design"}, {"text": "Application", "label": "Stage 2", "meta": "Does the person know, have the papers, and manage to apply?", "kids": [{"text": "People cannot complete the application on their own", "kids": [{"text": "46.8% of adults face at least one of three barriers: no account, cannot use the internet, cannot read. 27.0% face one, 18.2% two and 1.6% all three.", "label": "What we see", "meta": "Source: CAMS 2022-23 (NSS 79th round), adults 18+  ·  Established", "kind": "see"}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "Two or more barriers: 8.6% of adults in India-1, 23.6% in India-2 core and 28.5% in Deep India-2.", "meta": "Source: CAMS 2022-23 (NSS 79th round)", "kind": "ev"}, {"text": "Among people 15+, 40.1% cannot use the internet and 41.2% cannot use a smartphone.", "meta": "Source: CAMS 2022-23 (NSS 79th round)", "kind": "ev"}], "kind": "hub"}, {"text": "Online and paper forms assume reading, a phone, an account and time; many applicants lack one or more.", "label": "How it fails", "kind": "leaf"}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "Low digital or functional literacy; language", "label": "Cause", "meta": "Named in the cause list but not sized in the 20-scheme model", "kids": [{"text": "The barrier sits with the applicant's skills and the form's design. Controls it: Scheme departments.", "kind": "leaf"}], "kind": "cause"}], "kind": "hub"}, {"text": "Hands-on help with forms and documents, in the person's language, by voice", "label": "Possible intervention", "meta": "Proof so far: J-PAL trial of Delhi widow pensions (2015; 1,257 women in 75 slums): help with the application raised enrolment by 6.2 points (+42%); with accompaniment to the office, completed applications rose 10.6 points (+70%)  ·  By: Frontline staff; assisted channels", "kind": "fix"}, {"text": "Scheme departments; frontline staff", "label": "Who controls the change", "kind": "who"}, {"text": "Size 5 × evidence 3 × movable 3 = 45 of 45", "label": "Why it ranks here", "kids": [{"text": "Nearly half of adults; 23.6% in India-2 core face two or more barriers", "label": "Size", "kind": "leaf"}, {"text": "CAMS 2022-23 microdata on about 9 lakh adults, plus an Indian trial", "label": "Evidence strength", "kind": "leaf"}, {"text": "An assisted channel acts on it directly", "label": "How movable", "kind": "leaf"}], "kind": "hub"}, {"text": "2 findings from the survey analysis", "label": "Research behind it", "kids": [{"text": "Six in ten of the poorest adults face at least one of three access barriers", "kids": [{"text": "An assisted, voice-first channel is not a nicety: most of the poorest cannot self-serve. About a quarter of Deep India-2 adults face two barriers at once (26.0%, against 7.5% in India-1).", "label": "What it means", "kind": "leaf"}], "kind": "inf"}, {"text": "The poorest adults prefer a voice call to an SMS; the richest the reverse", "kids": [{"text": "A voice-first channel is the right default for the poorest and women; a text-first product would fit only the better off.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}], "kind": "hub"}], "kind": "prob", "id": "A1", "rank": 1, "score": 45, "fam": "demand"}, {"text": "Missing documents block the claim", "kids": [{"text": "12.1% of children under 5 have no birth certificate, and 5.4% of adults have no bank, financial-institution or mobile-money account.", "label": "What we see", "meta": "Source: CAMS 2022-23 (NSS 79th round); 'not known' counted as no certificate  ·  Established", "kind": "see"}, {"text": "1 further data point", "label": "More evidence", "kids": [{"text": "Documents asked for at application: 6 for Rajasthan's construction-worker scheme, 10 for Maharashtra's Lek Ladki.", "meta": "Source: Scheme rules, 2026", "kind": "ev"}], "kind": "hub"}, {"text": "Each scheme asks for its own set of papers; one missing paper stops the application.", "label": "How it fails", "kind": "leaf"}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Missing documents or certificates", "label": "Cause", "meta": "0.1 to 5.6 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "No birth, caste or income paper, or no Aadhaar in the right form. The PM-JAY figure is mostly an upper bound from Aadhaar coverage.", "kind": "leaf"}], "kind": "cause"}, {"text": "Identity or data mismatch (Aadhaar, name spelling, bank mapping)", "label": "Cause", "meta": "0.5 to 3 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "A name or account written differently across records blocks authentication or payment. Controls it: UIDAI, NPCI, banks, state agencies.", "kind": "leaf"}], "kind": "cause"}], "kind": "hub"}, {"text": "Help people get and digitise documents before they apply", "label": "Possible intervention", "meta": "Proof so far: Delhi trial (rank 1): supporting documents were the main remaining barrier  ·  By: Revenue and registration offices; assisted channels", "kind": "fix"}, {"text": "Revenue and civil-registration offices; frontline staff", "label": "Who controls the change", "kind": "who"}, {"text": "Size 3 × evidence 3 × movable 3 = 27 of 45", "label": "Why it ranks here", "kids": [{"text": "About 1 in 8 young children; a small share of adults", "label": "Size", "kind": "leaf"}, {"text": "CAMS and NSS Multiple Indicator Survey microdata", "label": "Evidence strength", "kind": "leaf"}, {"text": "Document help is direct", "label": "How movable", "kind": "leaf"}], "kind": "hub"}, {"text": "4 findings from the survey analysis", "label": "Research behind it", "kids": [{"text": "In our cause model, missing documents explain little; caps, withheld funds and frozen lists are the largest causes", "kids": [{"text": "Identity and paper problems are real for individuals but small as a share of the national gap. A pilot that only fixes documents would address a small slice.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}, {"text": "Missing birth certificates follow poverty: the poorest children are missed at the same rate in developed and lagging places (16.3% vs 16.9%)", "kids": [{"text": "An identity gap starts at birth and is a poverty gap, the same in a developed city as in lagging India. Since the ration gap is not the same in both, identity at this level cannot be what separates the urban poor.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}, {"text": "Four in ten migrants moved no documents, yet almost none report a problem", "kids": [{"text": "Missing local documents are common but rarely felt as a barrier. India-1's poor moved documents slightly less often (54.0% vs 57.6%) but report fewer problems (2.1% vs 3.5%). A ration card left in the home village would show up as 'card but no purchase', not as a reported problem.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}, {"text": "Poorest city adults are less often banked than poorest villagers in lagging districts", "kids": [{"text": "This is the one identity signal that points the urban way: the city poor are more often outside the bank (a know-your-customer and address-proof problem for recent arrivals is one reading). It matters for cash schemes, not for grain.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}], "kind": "hub"}], "kind": "prob", "id": "A3", "rank": 4, "score": 27, "fam": "demand"}, {"text": "People do not know the scheme or that they qualify", "kids": [{"text": "38.5% of eligible rural households in a six-state survey had not heard of PM-JAY.", "label": "What we see", "meta": "Source: Parisi and others, Health Policy and Planning 2023 (survey Dec 2019 to Feb 2020)  ·  Likely", "kind": "see"}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "Crop insurance: 37 to 69% of farmers who did not insure did not know the scheme.", "meta": "Source: Published analysis of 2018-19 farm-household data", "kind": "ev"}, {"text": "School-education benefits: 56.8% of households aware when the informant is a graduate, 28.5% when the informant cannot read.", "meta": "Source: NSS Multiple Indicator Survey 2020-21", "kind": "ev"}], "kind": "hub"}, {"text": "Schemes wait for an application, so people who do not know never start.", "label": "How it fails", "kind": "leaf"}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Not aware of the scheme or of their own eligibility", "label": "Cause", "meta": "7.9 to 20.3 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "In the sample this is mostly crop insurance and PM-JAY. Controls it: Scheme departments and frontline staff.", "kind": "leaf"}], "kind": "cause"}, {"text": "Low trust, fear or stigma", "label": "Cause", "meta": "Named but not sized; no national survey item", "kids": [{"text": "No national survey asks about it. Controls it: Frontline staff; civil society.", "kind": "leaf"}], "kind": "cause"}], "kind": "hub"}, {"text": "Information on its own", "label": "Possible intervention", "meta": "Proof so far: Karnataka trial of facilitation agents (Berg, Rajasekhar and Manjula 2022): awareness rose, applications and receipt did not  ·  By: Departments", "kind": "fix"}, {"text": "Information paired with the hands-on help under rank 1", "label": "Possible intervention", "meta": "Proof so far: See the Delhi trial under rank 1  ·  By: Assisted channels", "kind": "fix"}, {"text": "Scheme departments; frontline staff", "label": "Who controls the change", "kind": "who"}, {"text": "Size 4 × evidence 1 × movable 2 = 8 of 45", "label": "Why it ranks here", "kids": [{"text": "7.9 to 20.3 points of the gap, a range only", "label": "Size", "kind": "leaf"}, {"text": "Published tables from 2017 to 2020 that we could not audit", "label": "Evidence strength", "kind": "leaf"}, {"text": "Information alone did not change receipt in India", "label": "How movable", "kind": "leaf"}], "kind": "hub"}], "kind": "prob", "id": "A2", "rank": 11, "score": 8, "fam": "demand"}, {"text": "Claiming costs more than the benefit is worth", "kids": [{"text": "64% of households without a ration card did not apply because of the time it takes.", "label": "What we see", "meta": "Source: Javed and Mumtaz, systematic review 2024 (underlying data not available to audit)  ·  Likely", "kind": "see"}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "Cooking gas: the buyer pays Rs 942 a cylinder upfront in Delhi, before the Rs 300 subsidy is credited (since Jun 2026).", "meta": "Source: Oil company retail price", "kind": "ev"}, {"text": "Cooking gas: median willingness to pay is Rs 500 against a net price of Rs 642.", "meta": "Source: CEEW household survey, 2024-25", "kind": "ev"}], "kind": "hub"}, {"text": "Trips, lost wages, fees and upfront prices make the claim a loss for some households.", "label": "How it fails", "kind": "leaf"}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Claim cost too high (cash, trips, lost wages)", "label": "Cause", "meta": "5.5 to 10.8 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "The refill price, the premium or the trips needed outweigh the benefit. Controls it: Cabinet and state governments (scheme design).", "kind": "leaf"}], "kind": "cause"}, {"text": "Choice not to claim (benefit worth less than the effort)", "label": "Cause", "meta": "4.5 to 11.7 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "People judge the benefit too small or uncertain; mostly crop-insurance farmers who say they have no need. Controls it: Scheme design.", "kind": "leaf"}], "kind": "cause"}], "kind": "hub"}, {"text": "Lower the cost of each trip: doorstep or assisted filing", "label": "Possible intervention", "meta": "Proof so far: No trial of this fix; the Jharkhand finding below shows how an added step raises trip costs  ·  By: Departments; assisted channels", "kind": "fix"}, {"text": "Cabinet and state governments for prices; departments for the process", "label": "Who controls the change", "kind": "who"}, {"text": "Size 3 × evidence 1 × movable 2 = 6 of 45", "label": "Why it ranks here", "kids": [{"text": "5.5 to 10.8 and 4.5 to 11.7 points of the gap, ranges only", "label": "Size", "kind": "leaf"}, {"text": "Reviews and older studies", "label": "Evidence strength", "kind": "leaf"}, {"text": "Process cost can be cut; price is policy", "label": "How movable", "kind": "leaf"}], "kind": "hub"}, {"text": "1 finding from the survey analysis", "label": "Research behind it", "kids": [{"text": "A biometric fix in Jharkhand raised trip costs 17% and left leakage unchanged", "kids": [{"text": "A digital identity step added to a weak shop-level process shifted cost to the citizen. Mandatory Aadhaar checks need a fallback, and the weak link is the weighing, not the identity.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}], "kind": "hub"}], "kind": "prob", "id": "A4", "rank": 15, "score": 6, "fam": "demand"}], "kind": "stage", "fam": "demand"}, {"text": "Enrolment and approval", "label": "Stage 3", "meta": "Is the person put on the list?", "kids": [{"text": "Eligible people inside the ceiling are not on the list", "kids": [{"text": "2.65 crore people fit inside the free-grain ceiling but are not on a ration-card list: 78.70 crore are listed (Aug 2026) against a ceiling of 81.35 crore. This is a floor, because the lists also hold some ineligible people. It is separate from the people above the ceiling in Stage 1.", "label": "What we see", "meta": "Source: Food ministry NFSA data, Aug 2026; ceiling set on Census 2011  ·  Likely", "kind": "see"}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "PM-JAY for people 70 and over: 1.14 crore cards issued against a target of 6 crore (19.0%), 16 months after launch.", "meta": "Source: National Health Authority dashboard, 2026", "kind": "ev"}, {"text": "Bihar old-age pension (MVPY): 86.0% of the eligible count is on the list.", "meta": "Source: Bihar social welfare department records, 2026", "kind": "ev"}], "kind": "hub"}, {"text": "Lists are built once and refreshed rarely; new households, split families and migrants are not added.", "label": "How it fails", "kind": "leaf"}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "Not explained by any evidence", "label": "Cause", "meta": "5.2 to 36.4 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "The part of the gap no evidence explains, kept separate and never spread over named causes. Mostly PM-JAY people not carded (11.5) and farmers not insured (10.8). Controls it: Not assigned.", "kind": "leaf"}], "kind": "cause"}, {"text": "Old population base: see Stage 1, rank 9", "label": "Shared cause", "kind": "leaf"}, {"text": "Slow verification: see the next problem", "label": "Shared cause", "kind": "leaf"}], "kind": "hub"}, {"text": "Enrol people from existing data, then confirm with the household", "label": "Possible intervention", "meta": "Proof so far: No Indian trial with an enrolment outcome; the Indonesian evidence is mixed  ·  By: State departments", "kind": "fix"}, {"text": "Food ministry and state departments; National Health Authority for PM-JAY", "label": "Who controls the change", "kind": "who"}, {"text": "Size 4 × evidence 2 × movable 2 = 16 of 45", "label": "Why it ranks here", "kids": [{"text": "About 2.7 crore people inside the grain ceiling, plus 4.9 crore people aged 70 and over without a PM-JAY card", "label": "Size", "kind": "leaf"}, {"text": "Official lists against a calibrated survey count", "label": "Evidence strength", "kind": "leaf"}, {"text": "Needs state systems", "label": "How movable", "kind": "leaf"}], "kind": "hub"}, {"text": "1 finding from the survey analysis", "label": "Research behind it", "kids": [{"text": "Payment tracking reaches the smallest slice of our gap model; proactive eligibility and assisted access the largest", "kids": [{"text": "Our cause model says payment tracking reaches the least of the gap (0.6 to 3.3 points), yet the surveys show large losses after approval. Both can hold: the 20-scheme sample was chosen by unspent budget and mostly measures eligibility and rules, not what households receive. Proactive eligibility is largest in rupees; assisted access reaches a similar or larger share of people.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}], "kind": "hub"}], "kind": "prob", "id": "N1", "rank": 7, "score": 16, "fam": "delivery"}, {"text": "Applications stall or are rejected at verification", "kids": [{"text": "32.64% of the SECC housing list was removed at gram sabhas before the PMAY-G beneficiary list was made.", "label": "What we see", "meta": "Source: PMAY-G records (rural development ministry), 2026  ·  Likely", "kind": "see"}, {"text": "3 further data points", "label": "More evidence", "kids": [{"text": "PMAY-G registration then reached 94.0% of the legal list.", "meta": "Source: PMAY-G records, 2026", "kind": "ev"}, {"text": "Bihar old-age pension: 2.47% of applications rejected and 3.09% pending.", "meta": "Source: Bihar social welfare department records, 2026", "kind": "ev"}, {"text": "Maharashtra Shravan Bal: the beneficiary count fell 31% after the move to direct transfer (Dec 2024).", "meta": "Source: Maharashtra department records, 2025", "kind": "ev"}], "kind": "hub"}, {"text": "Approval waits on staff and offices; rejected and pending cases rarely come back.", "label": "How it fails", "kind": "leaf"}, {"text": "1 cause", "label": "Underlying cause", "kids": [{"text": "Verification bottleneck: staff gaps, vacancies, slow approval", "label": "Cause", "meta": "0.6 to 3.2 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "Applications wait for checks, and re-verification and de-duplication drives remove eligible people along with ineligible ones.", "kind": "leaf"}], "kind": "cause"}], "kind": "hub"}, {"text": "Track each application to a decision; escalate pending cases", "label": "Possible intervention", "meta": "Proof so far: No Indian trial measuring approvals  ·  By: Block and district offices", "kind": "fix"}, {"text": "State departments; block offices", "label": "Who controls the change", "kind": "who"}, {"text": "Size 2 × evidence 2 × movable 2 = 8 of 45", "label": "Why it ranks here", "kids": [{"text": "0.6 to 3.2 points of the gap; a few percent of applications", "label": "Size", "kind": "leaf"}, {"text": "Official counts", "label": "Evidence strength", "kind": "leaf"}, {"text": "Tracking can be supported", "label": "How movable", "kind": "leaf"}], "kind": "hub"}], "kind": "prob", "id": "N2", "rank": 11, "score": 8, "fam": "delivery"}], "kind": "stage", "fam": "delivery"}, {"text": "Fulfilment", "label": "Stage 4", "meta": "Is the benefit actually handed over, in full?", "kids": [{"text": "The insurance card is not honoured in private hospitals", "kids": [{"text": "82.7% of insured people's cases in private hospitals got no free care.", "label": "What we see", "meta": "Source: NSS 80th round health survey 2025; hospital cases excluding childbirth  ·  Likely", "kind": "see"}, {"text": "5 further data points", "label": "More evidence", "kids": [{"text": "Free care for insured patients: 96.2% of cases in government hospitals, 17.3% in private ones. Uninsured: 92.8% and 3.9%.", "meta": "Source: NSS 80th round health survey 2025", "kind": "ev"}, {"text": "Out-of-pocket cost per private case: Rs 46,844 for insured patients, Rs 45,268 for uninsured.", "meta": "Source: NSS 80th round health survey 2025", "kind": "ev"}, {"text": "Only 26.7% of card-holding households with a hospital stay report a scheme benefit (India-1 31.4%, India-2 core 24.5%; private-only stays 20.8%, government-only 31.6%).", "meta": "Source: HCES 2023-24 (MoSPI household consumption survey)", "kind": "ev"}, {"text": "609 private hospitals opted out of PM-JAY: Gujarat 233, Kerala 146, Maharashtra 83.", "meta": "Source: Moneylife report", "kind": "ev"}, {"text": "Meghalaya: 69% of 19,459 patients at five private hospitals paid extra (13,418 patients).", "meta": "Source: CAG audit of PM-JAY in Meghalaya, reported by Moneylife", "kind": "ev"}], "kind": "hub"}, {"text": "At the desk the card is refused, or medicines and tests are billed outside the package.", "label": "How it fails", "kind": "leaf"}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "The hospital carries the credit risk: paid after treatment, late or at low rates", "label": "Cause", "meta": "Not sized", "kids": [{"text": "Where payment is late or rates are low, the desk rations scheme beds, makes the patient buy medicines and tests, or leaves the scheme. Haryana suspended 650 hospitals over about Rs 490 crore of dues.", "kind": "leaf"}], "kind": "cause"}, {"text": "Too few empanelled hospitals within reach", "label": "Cause", "meta": "Not sized", "kids": [{"text": "46% of empanelled hospitals are private but they handle 58% of admissions; supply is thin in some districts. Controls it: State Health Agencies.", "kind": "leaf"}], "kind": "cause"}], "kind": "hub"}, {"text": "Before admission, find a hospital that honours the card; raise pre-authorisation at the desk; escalate refusals; record cashless care at discharge", "label": "Possible intervention", "meta": "Proof so far: No Indian trial; a measured pilot would be the first  ·  By: State Health Agencies; hospitals", "kind": "fix"}, {"text": "State Health Agencies, National Health Authority, hospitals", "label": "Who controls the change", "kind": "who"}, {"text": "Size 5 × evidence 3 × movable 3 = 45 of 45", "label": "Why it ranks here", "kids": [{"text": "Most private cases of insured people; 48 of every 100 insured cases overall", "label": "Size", "kind": "leaf"}, {"text": "NSS 2025 health microdata, 41,205 insured cases", "label": "Evidence strength", "kind": "leaf"}, {"text": "Desk-level support and escalation act on it directly", "label": "How movable", "kind": "leaf"}], "kind": "hub"}, {"text": "4 findings from the survey analysis", "label": "Research behind it", "kids": [{"text": "Insured patients pick private hospitals for trust and quality, not for distance or cost", "kids": [{"text": "The card does not change where people go; people go where they trust. Distance is a small reason partly because only people who reached a hospital are asked; those who could not get there are not in the question.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}, {"text": "Health cover is highest where hospitals are fewest and lowest where they are closest", "kids": [{"text": "Cards were issued where the poor are, not where hospitals are. In Deep India-2 a card has little to be used at; in India-1 it is the supply of empanelled private hospitals that is available, but fewer people hold the card.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}, {"text": "Developed cities look under-insured by government schemes, but their total health cover is as high or higher (61.9% vs 57.0%)", "kids": [{"text": "Part of the urban 'gap' in government cover is substitution by employer, ESIS and private cover, which is the opposite of exclusion. The urban poor specifically are still 7 points behind rural poor, so the rest is real.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}, {"text": "PM-JAY pays the richest fifth about eight times more per claim than the poorest fifth", "kids": [{"text": "The poor are more often carded and get far smaller claims. Where the money goes depends on treatment type and hospital choice, so card coverage overstates benefit to the poor.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}], "kind": "hub"}], "kind": "prob", "id": "F1", "rank": 1, "score": 45, "fam": "delivery"}, {"text": "Sanctioned cash is never paid", "kids": [{"text": "52 to 58 of every 100 eligible mothers got no JSY cash, and 48% of likely-eligible poor households have no pension income.", "label": "What we see", "meta": "Source: NFHS-5 2019-21 for JSY (41.7% received it by name, 48.0% any delivery cash; high-focus states 53.3%, other states 21.7%); PLFS 2025 for pensions (bottom 40%, 3.5 crore households)  ·  Likely", "kind": "see"}, {"text": "1 further data point", "label": "More evidence", "kids": [{"text": "PMMVY maternity benefit: 89.2% of enrolled women were paid by 31 Mar 2025 (390.23 of 437.49 lakh). There is no count of eligible women behind this.", "meta": "Source: Lok Sabha answer, 4 Apr 2025", "kind": "ev"}], "kind": "hub"}, {"text": "The money is approved but does not reach the account: unseeded or mismatched accounts, unspent releases, rules that differ by state.", "label": "How it fails", "kind": "leaf"}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Payment rail failure: account inactive or bank rejection", "label": "Cause", "meta": "0 to 0.1 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "Small in the official payment pipeline. Controls it: NPCI, banks.", "kind": "leaf"}], "kind": "cause"}, {"text": "Last-mile access: booking, refills, distance to bank or post office", "label": "Cause", "meta": "2.3 to 3.7 points of the exclusion gap in the 20-scheme sample", "kids": [{"text": "Delivery or refill does not reach the household; for example cooking-gas customers who never refill. Controls it: Oil companies, distributors, banks.", "kind": "leaf"}], "kind": "cause"}], "kind": "hub"}, {"text": "Before the event, check the person's own account and its Aadhaar mapping; file the claim; track it to credit", "label": "Possible intervention", "meta": "Proof so far: Telangana phone monitoring raised encashment by 1.3 points; Andhra Pradesh smartcards cut leakage by Rs 27 a household a week  ·  By: Welfare and health departments", "kind": "fix"}, {"text": "State health societies, welfare departments, NPCI and banks", "label": "Who controls the change", "kind": "who"}, {"text": "Size 4 × evidence 3 × movable 3 = 36 of 45", "label": "Why it ranks here", "kids": [{"text": "About 1.4 crore eligible births a year; up to 1.7 crore pensionless households", "label": "Size", "kind": "leaf"}, {"text": "NFHS-5 and PLFS microdata", "label": "Evidence strength", "kind": "leaf"}, {"text": "Account checks and claim tracking act on it directly", "label": "How movable", "kind": "leaf"}], "kind": "hub"}, {"text": "4 findings from the survey analysis", "label": "Research behind it", "kids": [{"text": "Mothers who deliver in a private facility are 34 points less likely to report JSY by name", "kids": [{"text": "Where the mother delivers is strongly linked to missing JSY (average reach 42.3%; an association, Tamil Nadu and Puducherry excluded), and young mothers are missed most. A pre-birth helper should steer to a government or accredited facility and check age and papers.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}, {"text": "Tamil Nadu looks weak on JSY by name, yet 65% of mothers get maternity cash", "kids": [{"text": "A naming question undercounts states with their own maternity cash. Maharashtra is the real low: both numbers are low. State design, not district delivery, drives much of the national figure.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}, {"text": "Among yearly benefits, the pension is worth most to the poor, yet 48% of likely-eligible poor households have none", "kids": [{"text": "Reach and value run in opposite directions. The scheme the system reaches best is the cheapest to the household; the ones that change a household's year are capped, listed or delayed.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}, {"text": "Among eligible old people, the poorest 40% are less likely to get a pension", "kids": [{"text": "Pensions reach the very old, women, SC and ST best, but not the poorest or crowded households, so a poverty-targeted scheme is mildly pro-less-poor inside the eligible group.", "label": "What it means", "kind": "leaf"}], "kind": "inf"}], "kind": "hub"}], "kind": "prob", "id": "F2", "rank": 3, "score": 36, "fam": "delivery"}, {"text": "Households get less grain than their entitlement", "kids": [{"text": "Households that receive free grain get 79.8% of their rule quantity on average, and 48.3% of them get at least 95%.", "label": "What we see", "meta": "Source: HCES 2023-24 (MoSPI household consumption survey); AAY and priority households that got any free grain  ·  Unresolved", "kind": "see"}, {"text": "3 further data points", "label": "More evidence", "kids": [{"text": "India-1 receiving households get 67.9% of the rule quantity; India-2 core 82.7%.", "meta": "Source: HCES 2023-24 (MoSPI household consumption survey)", "kind": "ev"}, {"text": "Among all AAY and priority card holders, 44.5% get at least 95% of their entitlement.", "meta": "Source: HCES 2023-24 (MoSPI household consumption survey)", "kind": "ev"}, {"text": "17.29% of receiving households got half or less of the rule quantity.", "meta": "Source: HCES 2023-24 (MoSPI household consumption survey)", "kind": "ev"}], "kind": "hub"}, {"text": "The shop machine records who came, not how many kilos left the shop.", "label": "How it fails", "kind": "leaf"}, {"text": "2 causes", "label": "Underlying cause", "kids": [{"text": "Dealer margin and weighing: the machine records entitlement, not kilos", "label": "Cause", "meta": "Outside the exclusion shares, which count people missed, not kilos; 6.4 to 14.6 points in a rupee-weighted check", "kids": [{"text": "Weighing and dealer margins decide what leaves the shop. Controls it: State food department; the Centre sets the margin norm.", "kind": "leaf"}], "kind": "cause"}, {"text": "Family members missing from the card (a hypothesis)", "label": "Cause", "meta": "Not sized", "kids": [{"text": "Households average 80% of entitlement while the national tonnage gap is about 7%, so part of the shortfall may be new members not on the card. Test: card member count against household size. Controls it: State food department.", "kind": "leaf"}], "kind": "cause"}], "kind": "hub"}, {"text": "Publish what reaches households, by place; link the shop machine to a scale", "label": "Possible intervention", "meta": "Proof so far: A weighing link was requested by the Centre, not required  ·  By: Food department", "kind": "fix"}, {"text": "State food departments; the Centre sets the dealer margin", "label": "Who controls the change", "kind": "who"}, {"text": "Size 4 × evidence 3 × movable 2 = 24 of 45", "label": "Why it ranks here", "kids": [{"text": "Most of about 79 crore card holders lose some quantity", "label": "Size", "kind": "leaf"}, {"text": "HCES microdata on 83,285 households; official offtake records show more (see Verification)", "label": "Evidence strength", "kind": "leaf"}, {"text": "Weighing and dealer margins need state action", "label": "How movable", "kind": "leaf"}], "kind": "hub"}, {"text": "1 finding from the survey analysis", "label": "Research behind it", "kids": [{"text": "Punjab and Gujarat miss many more poor households at the ration shop than Tamil Nadu", "kids": [{"text": "The ration shop works or fails by state design: low-exclusion states such as Tamil Nadu, Telangana and West Bengal run it as a broad service, while richer northern and western states treat it as a targeted one. A card in hand is not use (Rajasthan).", "label": "What it means", "kind": "leaf"}], "kind": "inf"}], "kind": "hub"}], "kind": "prob", "id": "F3", "rank": 5, "score": 24, "fam": "delivery"}, {"text": "Instalments stop before the full amount is paid", "kids": [{"text": "Only 29% of paid PMMVY women received every instalment; on average they got Rs 4,354 of the Rs 5,000 owed.", "label": "What we see", "meta": "Source: Centre for Policy Research brief on PMMVY (29%: 2022-23; Rs 4,354: Jul 2022)  ·  Likely", "kind": "see"}, {"text": "2 further data points", "label": "More evidence", "kids": [{"text": "JSY: 38.7% of eligible births were paid at least the rule amount (India-1 20.1%, Deep India-2 48.2%).", "meta": "Source: NFHS-5 2019-21", "kind": "ev"}, {"text": "Cooking gas: Rs 285.5 paid a refill on average against the Rs 300 subsidy.", function measure(n) {

  const g = svg.querySelector(`[data-p="${path}"]`); if (g) g.focus({preventScroll: true});
}
svg.addEventListener("click", e => { if (moved) return; const g = e.target.closest(".n"); if (g) toggle(g.dataset.p); });
svg.addEventListener("keydown", e => {
  const g = e.target.closest(".n"); if (!g) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(g.dataset.p); }
});
// drag to pan (mouse only; touch scrolls natively)
let drag = null, moved = false;
wrapEl.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || e.button) return; drag = {x: e.clientX, y: e.clientY, l: wrapEl.scrollLeft, t: wrapEl.scrollTop}; moved = false; });
addEventListener("pointermove", e => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 5) return;
  moved = true; wrapEl.classList.add("drag"); wrapEl.scrollLeft = drag.l - dx; wrapEl.scrollTop = drag.t - dy;
});
addEventListener("pointerup", () => { drag = null; wrapEl.classList.remove("drag"); setTimeout(() => moved = false, 0); });

function setZoom(z) {
  const cx = (wrapEl.scrollLeft + wrapEl.clientWidth / 2) / zoom, cy = (wrapEl.scrollTop + wrapEl.clientHeight / 2) / zoom;
  zoom = Math.min(1.6, Math.max(0.4, z)); render();
  wrapEl.scrollLeft = cx * zoom - wrapEl.clientWidth / 2; wrapEl.scrollTop = cy * zoom - wrapEl.clientHeight / 2;
}
document.getElementById("zin").onclick = () => setZoom(zoom * 1.2);
document.getElementById("zout").onclick = () => setZoom(zoom / 1.2);
document.getElementById("close").onclick = () => { open = new Set(["0", ...TREE.kids.map(k => k.path)]); render(); wrapEl.scrollTo(0, 0); };
document.getElementById("top3").onclick = () => {
  const probs = Object.values(byPath).filter(n => n.kind === "prob" && n.rank).sort((a, b) => b.score - a.score).slice(0, 3);
  open = new Set(["0", ...TREE.kids.map(k => k.path), ...probs.map(p => p.path)]);
  render();
  const first = probs.reduce((a, b) => a.y < b.y ? a : b);
  wrapEl.scrollTo({left: Math.max(0, (first.x - 40) * zoom - 200), top: Math.max(0, (first.y - 30) * zoom), behavior: "smooth"});
};
document.getElementById("notes").innerHTML = TREE.notes.map(([h, b]) => `<p><b>${esc(h)}</b> ${esc(b)}</p>`).join("");

if (innerWidth < 700) zoom = 0.8;
const fontsReady = Promise.all([FONTS.root.t, FONTS.prob.t, FONTS.other.t, FONTS.metaI.t, "700 10.5px 'Source Sans 3'"].map(f => document.fonts.load(f).catch(() => 0)));
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(render);
render();
</script>

</body>
